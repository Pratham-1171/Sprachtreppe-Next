        ❌ Mistake practice (${Object.keys(S.mistakes).length})<br>
        📚 New words · 📖 Grammar · 🎧 Listening · 🎤 Speaking
      </div>
    </div>
    <button class="btn" id="startSession" style="width:100%">${t('session_start')}</button>`;
  el.querySelectorAll('[data-len]').forEach(b => b.onclick = () => {
    S.settings.sessionLen = parseInt(b.dataset.len, 10); STORE.save();
    el.querySelectorAll('[data-len]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  });
  $('#startSession').onclick = () => {
    sessionState = {active:true, results:[], startTime:Date.now(), queue:[], idx:0, total:0};
    // Build a mix: 5 due, 3 mistakes, 5 new, 3 grammar, 1 listening, 1 speaking
    const dueWords = dueWordKeys().map(k => VOCAB.find(w => 'v'+w.n === k)).filter(Boolean);
    const mistakes = Object.values(S.mistakes).sort((a,b) => b.count - a.count);
    const queue = [];
    const warm = dueWords.length ? dueWords.slice(0, 5) : shuffle(VOCAB).slice(0, 5);
    warm.forEach(w => queue.push({kind:'vocab', w}));
    mistakes.slice(0, 3).forEach(m => queue.push({kind:'mistake', m}));
    shuffle(VOCAB.filter(w => !S.mastery['v'+w.n] || S.mastery['v'+w.n].status === 'NEW')).slice(0, 5).forEach(w => queue.push({kind:'vocab', w}));
    for(let i = 0; i < 3; i++) queue.push({kind:'generated', ex: generateExercise({skill:'mixed', level:'A2', difficulty:'mixed'})});
    queue.push({kind:'generated', ex: generateExercise({skill:'listening', level:'A2', difficulty:'normal'})});
    queue.push({kind:'generated', ex: generateExercise({skill:'sentence', level:'A2', difficulty:'normal'})});
    sessionState.queue = shuffle(queue);
    sessionState.total = queue.length;
    renderSessionCard(el);
  };
}

function renderSessionCard(el){
  if(sessionState.idx >= sessionState.total){ renderSessionSummary(el); return; }
  const item = sessionState.queue[sessionState.idx];
  el.innerHTML = `<div class="session-progress">${Array.from({length: sessionState.total}, (_, i) =>
    `<div class="sp-dot ${i < sessionState.idx ? 'done' : i === sessionState.idx ? 'current' : ''}"></div>`).join('')}</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Step ${sessionState.idx+1} of ${sessionState.total} · ${item.kind}</div>
    <div id="sessionBody"></div>`;
  const body = $('#sessionBody');
  if(item.kind === 'vocab'){
    const w = item.w;
    const ex = generateVocabExercise('de-en', [w, ...shuffle(VOCAB).slice(0,20)]);
    renderSessionExercise(body, ex, w);
  } else if(item.kind === 'mistake'){
    const m = item.m;
    body.innerHTML = `<div class="session-card"><div class="sc-type">Mistake review</div>
      <div style="font-size:15px;margin:8px 0">${esc(m.prompt)}</div>
      <div class="mini-muted">Your last: <span style="color:var(--warn)">${esc(m.userAnswer)}</span></div>
      <div class="mini-muted">Correct: <span style="color:var(--ok)">${esc(m.correctAnswer)}</span></div>
      <div class="mini-muted" style="margin-top:6px">${esc(m.explanation||'')}</div>
      <div class="row" style="margin-top:10px"><button class="btn good" id="sOk">✓ Got it</button></div></div>`;
    $('#sOk').onclick = () => {
      recordPracticeActivity('mistakes', true); sessionState.results.push({correct:true}); sessionState.idx++;
      addStudyTime(20); renderSessionCard(el);
    };
  } else if(item.kind === 'generated'){
    renderSessionExercise(body, item.ex, null);
  }
}

function renderSessionExercise(body, ex, w){ delete body.dataset.done;
  body.innerHTML = `<div class="session-card">
    <div class="sc-type">${ex.skill || 'practice'}</div>
    <div style="font-size:16px;margin:8px 0;line-height:1.5">${ex.promptHTML}</div>
    <div id="sOpts">${ex.options.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div class="fb" style="margin-top:10px;font-size:13px"></div>
  </div>`;
  wireSpeakers(body);
  if(ex.autoPlay) speakGerman(ex.autoPlay);
  const fb = body.querySelector('.fb');
  body.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if(body.dataset.done) return;
    body.dataset.done = '1';
    const ok = b.dataset.v === ex.correct;
    body.querySelectorAll('.opt').forEach(x => { x.disabled = true; if(x.dataset.v === ex.correct) x.classList.add('correct'); else if(x === b) x.classList.add('wrong'); });
    fb.textContent = (ok ? '✅ ' : '❌ Correct: ' + ex.correct + '. ') + (ex.explanation || '');
    fb.style.color = ok ? 'var(--ok)' : 'var(--warn)';
    if(w) updateMastery(vocabKey(w), ok ? 2 : 0); else recordPracticeActivity(ex.skill || 'session', ok);
    if(!ok) recordMistake({type:'session', topic:ex.topic||ex.skill, prompt:ex.prompt, userAnswer:b.dataset.v, correctAnswer:ex.correct, explanation:ex.explanation, sourceId:ex.sourceId});
    if(window.EX) EX.record(ex, ok); sessionState.results.push({correct:ok});
    addStudyTime(15);
    const nextButton = document.createElement('button'); nextButton.className='btn small'; nextButton.textContent='Next →'; nextButton.onclick=()=>{ sessionState.idx++; renderSessionCard($('#view')); }; body.appendChild(nextButton);
  });
}

function renderSessionSummary(el){
  const total = sessionState.results.length;
  const correct = sessionState.results.filter(r => r.correct).length;
  const accuracy = pct(correct, total);
  const duration = Math.floor((Date.now() - sessionState.startTime) / 1000);
  S.studyTime.sessions = (S.studyTime.sessions || 0) + 1;
  S.sessionHistory.push({date:localStudyDate(), questions:total, correct, duration});
  if(S.sessionHistory.length > 200) S.sessionHistory = S.sessionHistory.slice(-200);
  touchStreak(); STORE.save(); checkAchievements();
  sessionState.active = false;
  el.innerHTML = `<h2>${t('session_complete')}</h2>
    <div class="card" style="text-align:center"><div style="font-size:44px;font-weight:800;color:var(--accent)">${accuracy}%</div><div class="mini-muted">Accuracy</div></div>
    <div class="stats">
      <div class="stat"><div class="n">${correct}/${total}</div><div class="l">Correct</div></div>
      <div class="stat"><div class="n">${Math.floor(duration/60)}:${String(duration%60).padStart(2,'0')}</div><div class="l">Time</div></div>
      <div class="stat"><div class="n">${Object.keys(S.mistakes).length}</div><div class="l">Mistakes</div></div>
    </div>
    <div class="row"><button class="btn" id="toReview">Review mistakes</button><button class="btn ghost" id="finish">Finish</button></div>`;
  $('#toReview').onclick = () => location.hash = '#/review';
  $('#finish').onclick = () => location.hash = '#/home';
}

let vocabState = {q:'', topic:'all', art:'all', level:'all'};
function viewVocab(el){
  el.innerHTML = `<h2>📚 Vocabulary</h2><p class="sub">${VOCAB.length} words</p>
    <div class="card">
      <input type="search" id="vq" placeholder="${t('vocab_search')}" value="${esc(vocabState.q)}">

        <select id="vtopic" class="grow"><option value="all">${t('all_topics')}</option>${TOPIC_NAMES.map(x => `<option value="${esc(x)}" ${vocabState.topic===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
        <select id="vart" style="width:auto"><option value="all">${t('all_articles')}</option><option value="der" ${vocabState.art==='der'?'selected':''}>der</option><option value="die" ${vocabState.art==='die'?'selected':''}>die</option><option value="das" ${vocabState.art==='das'?'selected':''}>das</option></select>
        <select id="vlevel" style="width:auto"><option value="all">${t('all_levels')}</option><option value="A1" ${vocabState.level==='A1'?'selected':''}>A1</option><option value="A2" ${vocabState.level==='A2'?'selected':''}>A2</option><option value="B1" ${vocabState.level==='B1'?'selected':''}>B1</option></select>
      </div>
      <div class="mt row" style="justify-content:space-between">
        <span style="font-size:13px;color:var(--muted)" id="vcount"></span>
        <button class="btn small ghost" id="playAll">🔊 Play first 10</button>
      </div>
    </div>
    <div id="vlist" class="vlist"></div>`;
  const q = $('#vq'), topicSel = $('#vtopic'), a = $('#vart'), l = $('#vlevel');
  let currentList = [];
  const render = () => {
    vocabState.q = q.value.trim().toLowerCase();
    vocabState.topic = topicSel.value; vocabState.art = a.value; vocabState.level = l.value;
    const list = VOCAB.filter(w => {
      if(vocabState.topic!=='all' && w.topic!==vocabState.topic) return false;
      if(vocabState.art!=='all' && w.art!==vocabState.art) return false;
      if(vocabState.level!=='all' && w.level!==vocabState.level) return false;
      if(vocabState.q){
        const s = vocabState.q;
        const syn = SYNONYMS.find(x => x.word === w.de);
        const synText = syn ? syn.syn.map(x => x[0]).join(' ') : '';
        const opp = OPPOSITES.filter(p => p[0] === w.de || p[2] === w.de).map(p => p.join(' ')).join(' ');
        const hay = [w.de, w.en, guOf(w.de) || '', synText, opp].join(' ').toLowerCase();
        if(!hay.includes(s)) return false;
      }
      return true;
    });
    currentList = list;
    $('#vcount').textContent = `${list.length} shown`;
    const wrap = $('#vlist');
    if(!list.length){ wrap.innerHTML = `<div class="empty">${t('no_words')}</div>`; return; }
    wrap.innerHTML = list.slice(0, 400).map(w => vocabRowHTML(w)).join('') +
      (list.length > 400 ? `<div class="empty">Showing first 400 of ${list.length}.</div>` : '');
    wrap.querySelectorAll('.bookmark').forEach(b => {
      b.onclick = e => { e.stopPropagation(); const n = b.dataset.n; if(S.bookmarked[n]) delete S.bookmarked[n]; else S.bookmarked[n] = 1; STORE.save(); b.classList.toggle('on'); b.textContent = S.bookmarked[n] ? '★' : '☆'; };
    });
    wireSpeakers(wrap);
  };
  q.oninput = render; topicSel.onchange = render; a.onchange = render; l.onchange = render; render();
  $('#playAll').onclick = () => {
    const toPlay = currentList.slice(0, 10);
    if(!toPlay.length || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    toPlay.forEach(w => {
      const text = (w.art && w.art !== '-' ? w.art + ' ' : '') + w.de;
      const u = new SpeechSynthesisUtterance(text); u.lang='de-DE'; u.rate=S.settings.speechRate;
      const v = getGermanVoice(); if(v) u.voice=v; speechSynthesis.speak(u);
    });
    trackAudioPlay();
  };
}
function vocabRowHTML(w){

    <div><div class="vde">${artHTML(w.art)}${esc(w.de)} <span class="mastery-chip mastery-${m.status}">${m.status}</span></div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:2px"><span class="tag ${w.level}">${w.level}</span> <span style="margin-left:6px">${esc(w.topic)}</span></div></div>

function renderFlash(){

  if(flashState.idx >= total) flashState.idx = 0;

  const m = getMastery('v'+w.n);

  $('#flashCard').onclick = e => { if(e.target.classList.contains('speak-btn'))return; flashState.flipped = !flashState.flipped; renderFlash(); };
  $('#fcount').textContent = `${flashState.idx+1} / ${total}`;
  wireSpeakers(wrap);
  if(flashState.flipped){ $('#flashSrs').classList.remove('hidden'); $('#flashRevealRow').classList.add('hidden'); }
  else { $('#flashSrs').classList.add('hidden'); $('#flashRevealRow').classList.remove('hidden'); }
  if(!flashState.flipped && S.settings.autoPlay) speakGerman(speakText);
}
function nextFlash(){ flashState.idx = (flashState.idx + 1) % flashState.queue.length; flashState.flipped = false; renderFlash(); }

  sentence:    {label:'🧩 Sentence', gen:(d) => EXERCISE_REGISTRY.sentence({level:'A2', difficulty:'normal'})},
  mixed:       {label:'🎲 Mixed', gen:(d) => EXERCISE_REGISTRY.mixed({level:'A2', difficulty:'normal'})}
};

function buildQuizQueue(mode, count, difficulty){
  const gen = (QUIZ_MODES[mode] || QUIZ_MODES.article).gen;
  const d = diffN(difficulty);
  quizState.queue = [];
  for(let i = 0; i < count; i++) quizState.queue.push(gen(d));
  quizState.idx = 0; quizState.score = 0; quizState.answered = false;
}

function viewQuiz(el){
  const modes = Object.keys(QUIZ_MODES);
  el.innerHTML = `<h2>${t('quiz_title')}</h2><p class="sub">${t('quiz_sub')}</p>
    <div class="card"><div class="row" style="gap:6px">
      ${modes.map(k => `<button class="btn small ${quizState.mode===k?'':'ghost'}" data-mode="${k}">${QUIZ_MODES[k].label}</button>`).join('')}
    </div></div>
    ${setupPanelHTML('quiz', quizState.count, quizState.difficulty)}
    <button class="btn" id="quizStart" style="width:100%">▶ Start (infinite)</button>
    <div id="quizBox" style="margin-top:14px"></div>`;
  el.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { quizState.mode = b.dataset.mode; viewQuiz(el); });
  wireSetupPanel(el, (group, val) => {
    if(group === 'count') quizState.count = +val;
    if(group === 'difficulty') quizState.difficulty = val;
  });
  $('#quizStart').onclick = () => {
    const setup = readSetupPanel(el, 'quiz');
    quizState.count = setup.count;
    quizState.difficulty = setup.difficulty;
    buildQuizQueue(quizState.mode, setup.count, setup.difficulty);
    renderQuiz();
  };
}

function renderQuiz(){
  const box = $('#quizBox');
  if(!quizState.queue.length){ box.innerHTML = ''; return; }
  if(quizState.idx >= quizState.queue.length){
    // Refill — infinite
    const more = quizState.count || 20;
    const gen = (QUIZ_MODES[quizState.mode] || QUIZ_MODES.article).gen;
    const d = diffN(quizState.difficulty);
    for(let i = 0; i < more; i++) quizState.queue.push(gen(d));
  }
  const q = quizState.queue[quizState.idx];
  box.innerHTML = `<div class="card"><div class="qstat">
      <span>${t('question_of', quizState.idx + 1, quizState.queue.length)}</span>
      <span>${t('score_label', quizState.score)}</span>
    </div>
    <div style="font-size:16px;margin:8px 0 14px;line-height:1.5">${q.promptHTML}</div>
    <div id="opts">${q.options.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div id="feedback" class="mt" style="font-size:13.5px;color:var(--muted)"></div>
    <button class="btn small ghost mt" id="quizStop">⏹ Stop</button>
  </div>`;
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => answerQuiz(b, q));
  $('#quizStop').onclick = () => {
    quizState.queue = [];
    box.innerHTML = `<div class="card center"><h3>Stopped</h3><div class="mini-muted">You answered <b>${quizState.idx}</b> questions, ${quizState.score} correct.</div><button class="btn" id="again" style="margin-top:10px">New session</button></div>`;
    $('#again').onclick = () => viewQuiz($('#view'));
  };
  wireSpeakers(box);
}

function answerQuiz(btn, q){
  if(quizState.answered) return;
  quizState.answered = true;
  const ok = btn.dataset.v === q.correct;
  if(ok) quizState.score++;
  $$('#opts .opt').forEach(b => { b.disabled = true; if(b.dataset.v === q.correct) b.classList.add('correct'); else if(b === btn) b.classList.add('wrong'); });
  $('#feedback').innerHTML = ok ? '✅ Correct!' : `❌ Correct: <b>${esc(q.correct)}</b>. ${esc(q.explanation || '')}`;
  if(q.vocab) updateMastery(vocabKey(q.vocab), ok ? 2 : 0); else recordPracticeActivity(q.skill || 'quiz', ok);
  if(!ok) recordMistake({type:q.skill || 'quiz', topic:q.topic || q.skill, prompt:q.prompt, userAnswer:btn.dataset.v, correctAnswer:q.correct, explanation:q.explanation, sourceId:q.sourceId});
  const nextButton = document.createElement('button'); nextButton.className='btn small'; nextButton.textContent='Next →'; nextButton.onclick=()=>{ quizState.idx++; quizState.answered=false; renderQuiz(); }; $('#feedback').appendChild(nextButton);
}

    ans.innerHTML = sbState.answer.map((a, i) => `<span class="word" data-a="${i}">${esc(a.word)}</span>`).join('');
    ans.querySelectorAll('[data-a]').forEach(w => w.onclick = () => {
      const idx = +w.dataset.a;
      const removed = sbState.answer.splice(idx, 1)[0];
      sbState.used[removed.origIndex] = false;
      renderTiles(); renderAnswer();
    });
  };
  const renderTiles = () => {
    const tiles = $('#sbTiles');
    tiles.innerHTML = item.tokens.map((tk, i) => `<button class="builder-tile ${sbState.used[i]?'used':''}" data-i="${i}">${esc(tk)}</button>`).join('');
    tiles.querySelectorAll('.builder-tile').forEach(b => b.onclick = () => {
      const i = +b.dataset.i; if(sbState.used[i]) return;
      sbState.used[i] = true;
      sbState.answer.push({word: item.tokens[i], origIndex: i});
      renderTiles(); renderAnswer();
    });
  };
  if(sbState.used.length !== item.tokens.length){ sbState.used = item.tokens.map(() => false); sbState.answer = []; }
  renderAnswer(); renderTiles();
  $('#sbReset').onclick = () => { sbState.used = item.tokens.map(() => false); sbState.answer = []; renderTiles(); renderAnswer(); $('#sbFb').innerHTML = ''; };
  $('#sbNew').onclick = () => { sbState.item = null; sbState.used = []; sbState.answer = []; viewSentence(el); };
  $('#sbCheck').onclick = () => {
    const user = sbState.answer.map(a => a.word).join(' ').replace(/\s+/g, ' ').trim();
    const correct = item.answer.replace(/\s+/g, ' ').trim();
    const fb = $('#sbFb');
    const norm = s => String(s).toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' ').trim(); const ok = norm(user) === norm(correct) || (item.accept || []).some(a => norm(a) === norm(user)); if(!$('#sbCheck').dataset.logged){ recordPracticeActivity('sentence', ok); $('#sbCheck').dataset.logged = '1'; }
    fb.innerHTML = ok ? `<div style="padding:10px;background:rgba(22,163,74,.12);border-radius:8px;color:var(--ok);font-weight:650">✅ Correct!</div>` :
      `<div style="padding:10px;background:rgba(225,29,72,.10);border-radius:8px"><b>❌ Correct:</b> ${esc(correct)} ${speakerBtn(correct)}</div>`;
    if(ok){ S.sentencesBuilt = (S.sentencesBuilt||0) + 1; STORE.save(); checkAchievements(); }
    wireSpeakers(fb);
    setTimeout(() => { if(ok){ sbState.item = null; sbState.used = []; sbState.answer = []; viewSentence(el); } }, 1800);
  };
}

let spellState = {idx:0, pool:[], submitted:false};
function viewSpelling(el){
  if(!spellState.pool.length){
    const weak = VOCAB.filter(w => { const m = S.mastery['v'+w.n]; return m && (m.status === 'LEARNING' || m.status === 'FAMILIAR' || m.status === 'NEW'); });
    spellState.pool = shuffle(weak.length ? weak : VOCAB).slice(0, 30);
  }
  const w = spellState.pool[spellState.idx % spellState.pool.length];
  const speakText = (w.art && w.art !== '-' ? w.art + ' ' : '') + w.de;
  el.innerHTML = `<h2>${t('spelling_title')}</h2><p class="sub">Listen and type the German word.</p>
    <div class="card" style="text-align:center">
      <div style="margin:10px 0"><button class="btn" id="spPlay">🔊 Play</button></div>

      <input type="text" class="spell-input" id="spInput" placeholder="Type here…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn" id="spCheck">Check</button>

      </div>
      <div id="spFb" class="mt" style="font-size:14px;min-height:24px"></div>
    </div>`;
  const input = $('#spInput');
  setTimeout(() => input.focus(), 100);
  speakGerman(speakText);
  const checkAnswer = () => {
    if(spellState.submitted) return;
    spellState.submitted = true;
    const user = input.value.trim();
    const target = w.de.toLowerCase();
    const ok = user.toLowerCase().replace(/\s+/g, ' ') === target;
    input.classList.add(ok ? 'correct' : 'wrong');
    const fb = $('#spFb');
    if(ok){
      fb.innerHTML = '<span style="color:var(--ok);font-weight:650">✅ Correct!</span>';
      S.spelledCorrect = (S.spelledCorrect||0) + 1;
      updateMastery(vocabKey(w), 2);
    } else {
      fb.innerHTML = `<span style="color:var(--warn)">❌ Correct: </span><b>${esc(speakText)}</b> ${speakerBtn(speakText)}`;
      wireSpeakers(fb);
      updateMastery(vocabKey(w), 0);
      recordMistake({type:'spelling', topic:w.topic, prompt:`Spell: "${w.en}"`, userAnswer:user, correctAnswer:w.de, explanation:`${speakText} = ${meaningFull(w)}`, sourceId:'v'+w.n});
    }
  };
  $('#spCheck').onclick = checkAnswer;
  input.onkeydown = e => { if(e.key === 'Enter'){ spellState.submitted ? nextSpell(el) : checkAnswer(); } };

  $('#spNext').onclick = () => nextSpell(el);
}
function nextSpell(el){ spellState.idx = (spellState.idx + 1) % spellState.pool.length; if(spellState.idx === 0) spellState.pool = shuffle(spellState.pool); spellState.submitted = false; viewSpelling(el); }

let examState = {active:false, level:'A1', questions:[], idx:0, answers:[], startTime:0, timeLimit:1800, timer:null};
function viewExam(el){
  if(examState.active){ renderExamQuestion(el); return; }
  el.innerHTML = `<h2>${t('exam_title')}</h2><p class="sub">Timed test with mixed questions.</p>
    <div class="card"><h4 style="margin-top:0">Choose level:</h4>
      <div class="row">${['A1','A2','B1'].map(l => `<button class="btn ${examState.level===l?'':'ghost'}" data-level="${l}">${l}</button>`).join('')}</div>
    </div>
    <button class="btn" id="examStart" style="width:100%">${t('exam_start')}</button>`;
  el.querySelectorAll('[data-level]').forEach(b => b.onclick = () => { examState.level = b.dataset.level; viewExam(el); });
  $('#examStart').onclick = () => startExam(el);
}
function startExam(el){
  examState.questions = generateExerciseBatch({count:20, skill:'mixed', level:examState.level, difficulty:'mixed'});
  examState.idx = 0;
  examState.answers = new Array(20).fill(null);
  examState.startTime = Date.now();
  examState.active = true;
  examState.timeLimit = 1800;
  clearInterval(examState.timer);
  examState.timer = setInterval(() => {
    if(!examState.active) return;
    const elapsed = Math.floor((Date.now() - examState.startTime) / 1000);
    const remaining = examState.timeLimit - elapsed;
    const timeEl = $('#examTimer');
    if(timeEl){ const m = Math.floor(Math.abs(remaining)/60); const s = Math.abs(remaining)%60; timeEl.textContent = `${remaining<0?'-':''}${m}:${String(s).padStart(2,'0')}`; }
    if(remaining <= 0) finishExam(el);
  }, 1000);
  renderExamQuestion(el);
}
function renderExamQuestion(el){
  const q = examState.questions[examState.idx];
  const user = examState.answers[examState.idx];
  el.innerHTML = `<div class="exam-box">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
      <div><div style="font-size:12px;color:var(--muted);font-weight:700">EXAM · ${examState.level}</div>
      <div style="margin-top:4px">${examState.idx+1} / ${examState.questions.length}</div></div>
      <div class="exam-timer" id="examTimer">30:00</div>
    </div>
  </div>
  <div class="card"><div style="font-size:16px;margin-bottom:10px">${q.promptHTML}</div>
    <div id="exOpts">${q.options.map(o => `<button class="opt ${user === o ? 'correct' : ''}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
  </div>
  <div class="row">
    <button class="btn ghost" id="exPrev" ${examState.idx === 0 ? 'disabled' : ''}>← Prev</button>
    <button class="btn ghost" id="exAbort">Abort</button>
    ${examState.idx === examState.questions.length - 1 ? `<button class="btn good" id="exSubmit">Submit</button>` : `<button class="btn" id="exNext">Next →</button>`}
  </div>`;
  wireSpeakers(el);
  el.querySelectorAll('#exOpts .opt').forEach(b => b.onclick = () => {
    examState.answers[examState.idx] = b.dataset.v;
    el.querySelectorAll('#exOpts .opt').forEach(x => x.classList.remove('correct'));
    b.classList.add('correct');
  });
  const btnPrev = $('#exPrev'); if(btnPrev && !btnPrev.disabled) btnPrev.onclick = () => { examState.idx--; renderExamQuestion(el); };
  $('#exAbort').onclick = () => { if(confirm('Abort?')){ clearInterval(examState.timer); examState.active = false; viewExam(el); } };
  const btnNext = $('#exNext'); if(btnNext) btnNext.onclick = () => { examState.idx++; renderExamQuestion(el); };
  const btnSubmit = $('#exSubmit'); if(btnSubmit) btnSubmit.onclick = () => finishExam(el);
}
function finishExam(el){
  clearInterval(examState.timer);
  examState.active = false;
  const results = examState.questions.map((q,i) => ({q, user: examState.answers[i], ok: examState.answers[i] === q.correct}));
  results.forEach(r => { recordPracticeActivity(r.q.skill || 'exam', r.ok); if(window.EX) EX.record(r.q, r.ok); }); const correct = results.filter(r => r.ok).length;
  const accuracy = pct(correct, results.length);
  const bySkill = {};
  results.forEach(r => {
    const s = r.q.skill || 'vocabulary';
    if(!bySkill[s]) bySkill[s] = {done:0, correct:0};
    bySkill[s].done++; if(r.ok) bySkill[s].correct++;
    if(!r.ok) recordMistake({type:'exam_'+s, topic:r.q.topic, prompt:r.q.prompt, userAnswer:r.user, correctAnswer:r.q.correct, explanation:r.q.explanation, sourceId:r.q.sourceId});
  });
  el.innerHTML = `<h2>📊 Test Report</h2>
    <div class="card" style="text-align:center"><div style="font-size:52px;font-weight:800;color:var(--accent)">${accuracy}%</div><div class="mini-muted">${correct} / ${results.length}</div></div>
    <div class="stats">${Object.entries(bySkill).map(([k,v]) => `<div class="stat"><div class="n">${pct(v.correct,v.done)}%</div><div class="l">${esc(k)}</div></div>`).join('')}</div>
    <div class="row"><button class="btn" id="examAgain">Take again</button><button class="btn ghost" id="examHome">🏠</button></div>`;
  $('#examAgain').onclick = () => viewExam(el);
  $('#examHome').onclick = () => location.hash = '#/home';
}

function localStudyDate(date = new Date()) {
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
}
function recordPracticeActivity(skill, correct) {
  if (!S.practiceActivity) S.practiceActivity = {};
  const day = localStudyDate();
  const entry = S.practiceActivity[day] || { answers: 0, correct: 0, skills: {} };
  entry.answers++;
  if (correct) entry.correct++;
  entry.skills[skill] = (entry.skills[skill] || 0) + 1;
  S.practiceActivity[day] = entry;
  const stat = S.quizStats[skill] || { done: 0, correct: 0 };
  stat.done++; if (correct) stat.correct++;
  S.quizStats[skill] = stat;
  touchStreak(); STORE.save(); checkAchievements();
}
function practiceSnapshot() {
  const today = localStudyDate();
  const legacy = S.sessionHistory.filter(s => s.date === today).reduce((sum, s) => sum + s.questions, 0);
  const activeStreak = S.streak.lastStudyDate === today || S.streak.lastStudyDate === localStudyDate(new Date(Date.now() - 86400000));
  return {
    today: Math.max(S.practiceActivity?.[today]?.answers || 0, legacy),
    goal: S.settings.dailyGoal || 20,
    streak: activeStreak ? S.streak.current : 0,
    learned: Object.keys(S.mastery).filter(k => k.startsWith('v') && ['STRONG', 'MASTERED'].includes(S.mastery[k].status)).length,
    due: dueCount(), mistakes: Object.keys(S.mistakes).length, total: VOCAB.length, lang: S.settings.lang,
    words: VOCAB.filter(w => ['der', 'die', 'das'].includes(w.art)).map(({ n, art, de, en, level }) => ({ n, art, de, en, level })),
    labels: Object.fromEntries(NAV.map(([id, key]) => [id, t(key).replace(/^[^\p{L}\p{N}]+/u, '').trim()]))
  };
}

/* ===== Sync bridge (protocol v1): courseReady, loadState, stateChange ===== */
const COURSE_PROTOCOL = 'course-state-v5/bridge-1';
const STATE_CHANGE_DELAY = 400;
const REQUIRED_OBJECT_KEYS = ['known', 'bookmarked', 'quizStats', 'grammarDone', 'mastery', 'mistakes', 'streak', 'studyTime', 'achievements', 'settings'];
const SYSTEM_EVENT_KEY = 'sprachtreppe-system-event';
let lastAppliedStateVersion = -1;
let stateChangeTimer = 0;
let pendingHint = null;
let stateBaseline = {};

function courseUuid() {
  if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
}
function cloneState() { return JSON.parse(JSON.stringify(S)); }
function captureBaseline() { stateBaseline = {}; Object.keys(S).forEach(k => { if (k !== 'lastView') stateBaseline[k] = JSON.stringify(S[k]); }); }
function changedStateKeys() {
  const keys = new Set([...Object.keys(S), ...Object.keys(stateBaseline)]);
  keys.delete('lastView');
  return [...keys].filter(k => JSON.stringify(S[k]) !== stateBaseline[k]);
}
function isPlainObject(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
function isCompatibleState(state) {
  if (!isPlainObject(state)) return false;
  if (!REQUIRED_OBJECT_KEYS.every(k => isPlainObject(state[k]))) return false;
  if (state.sessionHistory !== undefined && !Array.isArray(state.sessionHistory)) return false;
  if (state.practiceActivity !== undefined && !isPlainObject(state.practiceActivity)) return false;
  if (state.settings.lang !== undefined && !['en', 'gu'].includes(state.settings.lang)) return false;
  return Object.values(state.mastery).every(m => isPlainObject(m) && typeof m.status === 'string');
}
function localStateTimestamp() {
  let max = 0;
  Object.values(S.mastery || {}).forEach(m => { if (typeof m.lastSeen === 'number' && m.lastSeen > max) max = m.lastSeen; });
  Object.values(S.mistakes || {}).forEach(m => { if (typeof m.lastSeen === 'number' && m.lastSeen > max) max = m.lastSeen; });
  Object.values(S.achievements || {}).forEach(v => { if (typeof v === 'number' && v > max) max = v; });
  return max || null;
}
function postToShell(message) { if (window.parent !== window) window.parent.postMessage(message, window.location.origin); }
function hintChange(eventType, entityType, entityId, payload) { pendingHint = { eventType, entityType, entityId: String(entityId), payload: payload || {} }; }

function classifyChange(keys) {
  const has = list => list.some(k => keys.includes(k));
  if (has(['practiceActivity', 'quizStats', 'mistakes', 'sessionHistory'])) return ['answer', 'quiz'];
  if (has(['mastery', 'known'])) return ['mastery', 'vocab'];
  if (has(['grammarDone'])) return ['completion', 'grammar'];
  if (has(['studyTime'])) return ['study_time', 'system'];
  if (has(['settings'])) return ['setting', 'system'];
  return ['completion', 'system'];
}
function emitStateChange(forced) {
  const keys = changedStateKeys();
  if (!keys.length && !forced) { pendingHint = null; return; }
  const [type, entity] = classifyChange(keys);
  const hint = forced || pendingHint || {};
  postToShell({
    source: 'course-engine', type: 'stateChange', clientEventId: courseUuid(), timestamp: new Date().toISOString(),
    eventType: hint.eventType || type, entityType: hint.entityType || entity, entityId: hint.entityId || (keys[0] || 'state'),
    eventPayload: Object.assign({ changedKeys: keys }, hint.payload || {}), snapshot: cloneState()
  });
  pendingHint = null;
  captureBaseline();
}
function scheduleStateChange() { clearTimeout(stateChangeTimer); stateChangeTimer = setTimeout(() => emitStateChange(null), STATE_CHANGE_DELAY); }

const bridgeSave = STORE.save;
STORE.save = function () { bridgeSave(); scheduleStateChange(); };

/* Event hints: wrap global entry points without altering their logic. */
const bridgeUpdateMastery = updateMastery;
updateMastery = function (key, quality) { hintChange('mastery', 'vocab', key, { quality }); return bridgeUpdateMastery.apply(this, arguments); };
const bridgeRecordActivity = recordPracticeActivity;
recordPracticeActivity = function (skill, correct) {
  if (!pendingHint || pendingHint.eventType !== 'mastery') hintChange('answer', skill === 'grammar' ? 'grammar' : skill === 'exam' ? 'exam' : 'quiz', skill, { skill, correct: !!correct });
  else pendingHint.payload = Object.assign({}, pendingHint.payload, { skill, correct: !!correct });
  return bridgeRecordActivity.apply(this, arguments);
};
const bridgeAddStudyTime = addStudyTime;
addStudyTime = function (seconds) { if (!pendingHint) hintChange('study_time', 'system', 'studyTime', { seconds }); return bridgeAddStudyTime.apply(this, arguments); };

/* Called (via prepare-course.py) right before import/reset reloads the page. */
function markSystemEvent(kind) { try { sessionStorage.setItem(SYSTEM_EVENT_KEY, kind); } catch (e) {} }

function applyLoadedState(data) {
  if (data.replaceLocal !== true || typeof data.stateVersion !== 'number' || !Number.isFinite(data.stateVersion) || data.stateVersion < 0) return false;
  if (data.stateVersion < lastAppliedStateVersion) return false;
  if (!isCompatibleState(data.state)) return false;
  const incoming = JSON.parse(JSON.stringify(data.state));
  const fresh = STORE.defaults();
  fresh.settings = Object.assign(STORE.defaults().settings, incoming.settings || {});
  Object.keys(S).forEach(k => { delete S[k]; });
  Object.assign(S, fresh, incoming, { settings: fresh.settings, lastView: S.lastView || incoming.lastView || 'home' });
  lastAppliedStateVersion = data.stateVersion;
  clearTimeout(stateChangeTimer); pendingHint = null;
  originalCourseSave();           // persist via existing STORE without emitting a learning event
  captureBaseline();
  applyTheme(); applySettingsToDOM(); applyLanguage(true);
  announceCourseState();
  return true;
}

window.addEventListener('message', event => {
  if (event.origin !== window.location.origin || event.source !== window.parent) return;
  const data = event.data;
  if (!isPlainObject(data) || data.source !== 'practice-desk' || data.command !== 'loadState') return;
  const accepted = (() => { try { return applyLoadedState(data); } catch (e) { return false; } })();
  postToShell({ source: 'course-engine', type: 'loadStateResult', accepted, stateVersion: typeof data.stateVersion === 'number' ? data.stateVersion : null });
});

function announceReady() {
  let hasLocalState = false;
  try { hasLocalState = !!localStorage.getItem(STORE.key) && isCompatibleState(S); } catch (e) {}
  postToShell({ source: 'course-engine', type: 'courseReady', clientVersion: COURSE_PROTOCOL, hasLocalState, localStateTimestamp: localStateTimestamp() });
  let systemEvent = null;
  try { systemEvent = sessionStorage.getItem(SYSTEM_EVENT_KEY); sessionStorage.removeItem(SYSTEM_EVENT_KEY); } catch (e) {}
  if (systemEvent === 'reset' || systemEvent === 'import') emitStateChange({ eventType: 'reset', entityType: 'system', entityId: systemEvent, payload: { reason: systemEvent } });
}

const ADJ_FOR = {
  stuff:GENERAL_ADJ, dev:GENERAL_ADJ, vehicle:GENERAL_ADJ, wear:GENERAL_ADJ.concat(['bequem','warm']),
  read:['interessant','lang','gut','neu','alt','schön'], food:['frisch','lecker','gesund','gut','teuer','billig'],

const ADJ_END = {
  weak:{nom:{m:'e',f:'e',n:'e',p:'en'},akk:{m:'en',f:'e',n:'e',p:'en'},dat:{m:'en',f:'en',n:'en',p:'en'}},
  mixed:{nom:{m:'er',f:'e',n:'es',p:'en'},akk:{m:'en',f:'e',n:'es',p:'en'},dat:{m:'en',f:'en',n:'en',p:'en'}},
  strong:{nom:{m:'er',f:'e',n:'es',p:'e'},akk:{m:'en',f:'e',n:'es',p:'e'},dat:{m:'em',f:'er',n:'em',p:'en'}}
};
function adjFor(n){ for(const t of n.t){ if(ADJ_FOR[t]) return ADJ_FOR[t]; } return GENERAL_ADJ; }
function adjForm(adjKey, det, c, g){
  const type = det==='def' ? 'weak' : det==='none' ? 'strong' : 'mixed';
  return (ADJ[adjKey].decl || adjKey) + ADJ_END[type][c][g];
}
function adjEndingOf(adjKey, det, c, g){ return ADJ_END[det==='def'?'weak':det==='none'?'strong':'mixed'][c][g]; }

/* ---------- determiners & noun phrases ---------- */
const DEF = {nom:{m:'der',f:'die',n:'das',p:'die'},akk:{m:'den',f:'die',n:'das',p:'die'},dat:{m:'dem',f:'der',n:'dem',p:'den'}};
const IND = {nom:{m:'ein',f:'eine',n:'ein'},akk:{m:'einen',f:'eine',n:'ein'},dat:{m:'einem',f:'einer',n:'einem'}};
const NEG = {nom:{m:'kein',f:'keine',n:'kein',p:'keine'},akk:{m:'keinen',f:'keine',n:'kein',p:'keine'},dat:{m:'keinem',f:'keiner',n:'keinem',p:'keinen'}};
const POS = {nom:{m:'mein',f:'meine',n:'mein',p:'meine'},akk:{m:'meinen',f:'meine',n:'mein',p:'meine'},dat:{m:'meinem',f:'meiner',n:'meinem',p:'meinen'}};
const datPl = pl => /[ns]$/.test(pl) ? pl : pl+'n';
const CONTR = {'in|dat|dem':'im','in|akk|das':'ins','an|dat|dem':'am','zu|dat|dem':'zum','zu|dat|der':'zur'};

function np(n, o){
  o = o || {};
  const c = o.case || 'nom', pl = !!o.pl && !!n.pl;
  const g = pl ? 'p' : gOf(n);
  let d = o.det || 'def';
  if(d==='indef' && (n.mass || pl)) d = 'none';
  if(d==='neg' && false) d = 'neg';
  const noun = pl ? (c==='dat' ? datPl(n.pl) : n.pl) : n.de;
  let dTok = null;
  if(d==='def') dTok = DEF[c][g]; else if(d==='indef') dTok = IND[c][g];
  else if(d==='neg') dTok = NEG[c][g]; else if(d==='poss') dTok = POS[c][g];
  const adjTok = o.adj ? adjForm(o.adj, d, c, g) : null;
  const de = [].concat(dTok?[dTok]:[], adjTok?[adjTok]:[], [noun]);
  const nEn = pl ? (n.enPl || n.en+'s') : n.en;
  const core = (o.adj ? ADJ[o.adj].en+' ' : '') + nEn;
  let en;
  if(d==='def') en = 'the '+core;
  else if(d==='indef') en = artEn(core)+' '+core;
  else if(d==='poss') en = 'my '+core;
  else if(d==='neg') en = (n.mass||pl) ? 'any '+core : artEn(core)+' '+core;
  else en = core;
  return {de, en, det:d, case:c, g, pl, noun:n, adj:o.adj||null, artIdx:dTok?0:-1, adjIdx:adjTok?(dTok?1:0):-1, nounIdx:de.length-1};
}
function pPhrase(n, kind){
  const s = n[kind], g = gOf(n), art = DEF[s.c][g];
  const k = s.p+'|'+s.c+'|'+art;
  if(CONTR[k]) return {de:[CONTR[k], n.de], prep:s.p, case:s.c, art, contracted:true, noun:n};
  return {de:[s.p, art, n.de], prep:s.p, case:s.c, art, contracted:false, noun:n};
}

/* ---------- predicates (verb + arguments) ---------- */
function objGroup(v, lvl, o){
  o = o || {};
  const tags = v.obj.split(' ');
  const pool = nounsBy(tags, lvl, n => v.inf!=='mögen' || true);
  if(!pool.length) return null;
  const n = o.noun || pick(pool);
  const allowed = v.dets || ['def','indef','neg','poss','none'];
  let det;
  const isAbs = n.t.includes('abs');
  const isFam = n.t.includes('family');
  if(o.det) det = o.det;
  else if(isAbs) det = 'none';
  else {
    const opts = [];
    if(allowed.includes('def')) opts.push('def','def');
    if(allowed.includes('indef') && !n.mass) opts.push('indef');
    if(allowed.includes('poss') && (isFam || n.t.includes('people'))) { if(isFam) opts.push('poss','poss'); }
    if(!v.dets && n.mass) opts.push('none');
    if(!opts.length) opts.push('def');
    det = pick(opts);
    if(isFam && v.inf!=='haben' && (det==='indef' || det==='none') && allowed.includes('def')) det = pick(['poss','def']);
  }
  let pl = false;
  if(o.pl!==undefined){ pl = !!o.pl && !!n.pl; if(pl) det = 'none'; }
  else if(!o.noPlural && v.plOK && n.pl && !isFam && chance(0.18)){ pl = true; det = 'none'; }
  if(v.inf==='mögen' && !n.mass && !pl && det==='indef') det = 'def';
  const nph = np(n, {det, case:v.objCase||'akk', pl, adj:o.adj});
  const people = n.t.includes('people');
  return {k:'obj', de:nph.de, en:nph.en, rank:1, np:nph, noun:n,
          ask: v.objCase==='dat' ? 'Wem' : (people ? 'Wen' : 'Was'), askEn: people ? 'Who' : 'What'};
}
function toNeg(g){            // re-render an object group with kein- (only indefinite / bare nouns)
  if(g.k!=='obj' || !g.np) return g;
  if(g.np.det==='indef' || g.np.det==='none'){
    const nph = np(g.noun, {det:'neg', case:g.np.case, pl:g.np.pl, adj:g.np.adj});
    return Object.assign({}, g, {de:nph.de, en:nph.en, np:nph, negd:true});
  }
  return g;
}
function dirPlaceGroup(n){ const pp = pPhrase(n,'dir'); return {k:'dir', de:pp.de, en:n.enDir, rank:2, pp, noun:n, ask:'Wohin', askEn:'Where'}; }
function locPlaceGroup(n){ const pp = pPhrase(n,'loc'); return {k:'loc', de:pp.de, en:n.enLoc, rank:2, pp, noun:n, ask:'Wo', askEn:'Where'}; }
const homeDir = () => ({k:'dir', de:['nach','Hause'], en:'home', rank:2, ask:'Wohin', askEn:'Where', fixed:true});
const homeLoc = () => ({k:'loc', de:['zu','Hause'], en:'at home', rank:2, ask:'Wo', askEn:'Where', fixed:true});
const cityDir = c => ({k:'dir', de:['nach',c], en:'to '+c, rank:2, ask:'Wohin', askEn:'Where', city:c});
const cityLoc = c => ({k:'loc', de:['in',c], en:'in '+c, rank:2, ask:'Wo', askEn:'Where', city:c});
const cityFrom = c => ({k:'origin', de:['aus',c], en:'from '+c, rank:2, ask:'Woher', askEn:'Where', askEnTail:'from', city:c});
function mannerGroup(n, o){ o=o||{}; const nph = np(n,{det:o.det||'def',case:'dat',adj:o.adj}); return {k:'manner', de:['mit'].concat(nph.de), en:'by '+(o.adj?ADJ[o.adj].en+' ':'')+n.enBy, rank:3, np:nph, noun:n, ask:'Wie', askEn:'How'}; }

function makePred(lvl, o){
  o = o || {};
  const cands = Object.values(VL).filter(v => v.lvl<=lvl && (!o.filter || o.filter(v)));
  for(let tries=0; tries<30; tries++){
    const v = o.verb ? VL[o.verb] : pick(cands);
    if(!v) return null;
    const p = predFor(v, lvl, o);
    if(p) return p;
    if(o.verb) return null;
  }
  return null;
}
function predFor(v, lvl, o){
  const groups = [];
  switch(v.kind){
    case 'be': {
      if(chance(0.6) && !o.noAdj){ const a = pick(ADJ_STATE.filter(x=>x[2]<=lvl)); groups.push({k:'adj', de:[a[0]], en:a[1], rank:1, ask:null, adj:a[0]}); }
      else {
        const r = rnd();
        if(r<0.35) groups.push(homeLoc());
        else if(r<0.6) groups.push(cityLoc(pick(CITIES)));
        else groups.push(locPlaceGroup(pick(nounsBy(['go'], lvl))));
      }
      break;
    }
    case 'obj': { const g = objGroup(v, lvl, o); if(!g) return null; groups.push(g); break; }
    case 'lang': { const l = pick(LANGS); groups.push({k:'obj', de:[l.de], en:l.en, rank:1, bare:true, ask:'Was', askEn:'What'}); break; }
    case 'game': { const l = pick(GAMES); groups.push({k:'obj', de:[l.de], en:l.en, rank:1, bare:true, ask:'Was', askEn:'What'}); break; }
    case 'dir': { if(o.noun) groups.push(dirPlaceGroup(o.noun)); else if(chance(0.25)) groups.push(homeDir()); else groups.push(dirPlaceGroup(pick(nounsBy(['go'], lvl)))); break; }
    case 'drive': {
      groups.push(mannerGroup(pick(nounsBy(['vehicle'], lvl))));
      if(chance(0.55)) groups.push(cityDir(pick(CITIES))); else groups.push(dirPlaceGroup(pick(nounsBy(['far'], lvl))));
      break;
    }
    case 'origin': groups.push(cityFrom(pick(CITIES))); break;
    case 'live': { if(chance(0.85)) groups.push(cityLoc(pick(CITIES))); else groups.push(locPlaceGroup(NOUNS.find(n=>n.de==='Stadt'))); break; }
    case 'work': { if(chance(0.25)) groups.push(cityLoc(pick(CITIES))); else groups.push(locPlaceGroup(pick(nounsBy(['work'], lvl)))); break; }
    case 'sleep': if(chance(0.6)) groups.push(homeLoc()); break;
    case 'stay': groups.push(homeLoc()); break;
    case 'timeum': { const h = pick(HOURS); groups.push({k:'timeum', de:['um',h[0],'Uhr'], en:'at '+h[1]+" o'clock", rank:4, ask:'Wann', askEn:'When'}); break; }
    case 'shop': groups.push(locPlaceGroup(pick(nounsBy(['shop'], lvl)))); break;
    case 'none': break;
    default: return null;
  }
  return {v, groups};
}

/* ---------- clause builder ---------- */
/*
 spec: {kind:'decl'|'yn'|'wh'|'sub', subj, p, tense:'pres'|'perf'|'pret'|'k2'|'pass', modal, neg, adv, front, ask, conn}
*/
function verbPieces(spec, sub){
  const sl = spec.subj.slot, v = spec.p.v, m = spec.modal, t = spec.tense;
  if(t==='pass') return {finite:T.werden[sl], tail:[v.pp]};
  if(m){
    if(t==='pret') return {finite:PRET[m][sl], tail:[v.inf]};
    return {finite:T[m][sl], tail:[v.inf]};
  }
  if(t==='perf') return {finite:T[v.aux][sl], tail:[v.pp]};
  if(t==='pret') return {finite:PRET[v.inf][sl], tail:[]};
  if(t==='k2'){
    if(v.inf==='sein') return {finite:K2.wäre[sl], tail:[]};
    if(v.inf==='haben') return {finite:K2.hätte[sl], tail:[]};
    return {finite:K2.würde[sl], tail:[v.inf]};
  }
  if(v.sep){ return sub ? {finite:v.pre+fin(v,sl), tail:[]} : {finite:fin(v,sl), tail:[v.pre]}; }
  return {finite:fin(v,sl), tail:[]};
}
function midTokens(spec, opts){
  opts = opts || {};
  const parts = [];
  const groups = spec.p.groups.filter(g => g !== spec.ask);
  if(spec.adv && spec.front!=='adv' && !opts.noAdv) parts.push({k:'time', de:spec.adv.de});
  groups.forEach(g => parts.push(g));
  if(spec.neg && !groups.some(g=>g.negd)){
    const idx = parts.findIndex(x => ['dir','loc','manner','adj','origin','timeum'].includes(x.k));
    const nt = {k:'neg', de:['nicht']};
    if(idx<0) parts.push(nt); else parts.splice(idx,0,nt);
  }
  return parts;
}
function flat(parts){ return parts.reduce((a,x)=>a.concat(x.de), []); }
function endPunct(spec){ return spec.kind==='yn' || spec.kind==='wh' ? '?' : '.'; }

function layoutDE(spec){
  const subj = spec.subj, vp = verbPieces(spec, spec.kind==='sub');
  const midP = midTokens(spec);
  const mid = midP.map(x => ({r: x.k==='time' ? 'adv' : x.k==='neg' ? 'neg' : 'group', g:x, t:x.de.slice()}));
  const tail = vp.tail.map(x => ({r:'tail', t:[x]}));
  const F = {r:'finite', t:[vp.finite]}, SU = {r:'subj', t:[subj.de]};
  let segs;
  if(spec.kind==='sub'){
    const lead = spec.relPron ? {r:'rel', t:[spec.relPron]} : {r:'conn', t:[spec.conn]};
    segs = [lead, SU].concat(mid, tail, [F]);
  } else if(spec.kind==='yn'){
    segs = [F, SU].concat(mid, tail);
  } else if(spec.kind==='wh'){
    segs = spec.askType==='Wer' ? [{r:'wh', t:['Wer']}, F].concat(mid, tail) : [{r:'wh', t:[spec.ask.ask]}, F, SU].concat(mid, tail);
  } else if(spec.front==='adv' && spec.adv){
    segs = [{r:'adv', t:spec.adv.de.slice(), fronted:true}, F, SU].concat(mid, tail);
  } else if(spec.front==='sub' && spec.subText){
    segs = [{r:'front', t:spec.subText.slice()}, F, SU].concat(mid, tail);
  } else {
    segs = [SU, F].concat(mid, tail);
  }
  return segs;
}
function buildDE(spec){ return layoutDE(spec).reduce((a,s)=>a.concat(s.t), []); }

/* ---- English ---- */
function enParts(spec){
  const S = spec.subj, v = spec.p.v, m = spec.modal, t = spec.tense;
  const I = S.en==='I', e3 = S.e3;
  const beNow = I ? 'am' : (e3 ? 'is' : 'are'), bePast = (I||e3) ? 'was' : 'were';
  const past = (t==='perf' || t==='pret');
  let aux=null, L=null, tail=[];
  const ev = v.en;
  if(t==='pass'){ aux = spec.passPl ? 'are' : 'is'; tail=[ev.pp]; return {aux,L,tail}; }
  if(v.inf==='sein' && !m){ aux = past ? bePast : (t==='k2' ? 'were' : beNow); return {aux,L,tail}; }
  if(m){
    const M = MODAL_EN[m];
    if(past){
      if(m==='können') aux = 'could';
      else if(m==='dürfen'){ aux = bePast; tail=['allowed to', ev.b]; return {aux,L,tail}; }
      else L = {b:M.lex.b, s:M.lex.s, p:M.lex.p};
    } else if(M.be){ aux = beNow; tail.push('allowed to'); }
    else if(M.aux){ aux = M.aux; if(M.pre) tail.push(M.pre); }
    else L = {b:M.lex.b, s:M.lex.s, p:M.lex.p};
    tail.push(ev.b);
    return {aux,L,tail};
  }
  if(t==='k2'){
    if(v.inf==='haben'){ L = {b:'have', s:'has', p:'had'}; spec = Object.assign({}, spec, {tense:'pret'}); return {aux:null, L, tail, forcePast:true}; }
    aux = 'would'; tail=[ev.b]; return {aux,L,tail};
  }
  if(past){ L = {b:ev.b, s:ev.s, p:ev.p}; return {aux:null, L, tail, forcePast:true}; }
  const adv = spec.adv;
  if(!v.stative && adv && (adv.k==='now'||adv.k==='fut') && !spec.neg===!spec.neg && spec.kind!=='sub'){
    aux = beNow; tail=[ev.ing]; return {aux,L,tail};
  }
  L = {b:ev.b, s:ev.s, p:ev.p};
  return {aux:null, L, tail};
}
function buildEN(spec){
  const S = spec.subj, e3 = S.e3;
  const doNow = e3 ? 'does' : 'do';
  const ep = enParts(spec);
  const t = spec.tense;
  const past = ep.forcePast || t==='perf' || t==='pret';
  const groups = spec.p.groups.filter(g=>g!==spec.ask).slice().sort((a,b)=>(a.rank||9)-(b.rank||9));
  const rest = groups.map(g=>g.en);
  const adv = spec.adv && spec.kind==='decl' ? spec.adv : null;
  const advMid = adv && adv.mid;
  const advEnd = adv && !adv.mid ? [adv.en] : [];
  const neg = !!spec.neg;
  let subjEn = spec.subjEn || S.en;
  const q = spec.kind==='yn' || spec.kind==='wh';
  const out = [];
  const lexFinite = ep.L ? (past ? ep.L.p : (e3 ? ep.L.s : ep.L.b)) : null;
  const doAux = past ? 'did' : doNow;
  if(spec.kind==='wh'){
    const w = spec.ask.askEn;
    if(spec.askType==='Wer'){
      // subject question: "Who buys the apple?"
      const e = Object.assign({}, spec, {subj:{en:'who', e3:true, slot:'er'}, kind:'decl', neg:false, adv:null});
      const body = buildEN(e).replace(/\.$/,'').replace(/^Who /,'');
      return 'Who ' + body + '?';
    }
    const tailW = spec.ask.askEnTail ? [spec.ask.askEnTail] : [];
    if(ep.aux) out.push(w, ep.aux, subjEn, ...ep.tail, ...rest, ...tailW);
    else out.push(w, doAux, subjEn, ep.L.b, ...ep.tail, ...rest, ...tailW);
    return cap(out.join(' ')) + '?';
  }
  if(spec.kind==='yn'){
    if(ep.aux) out.push(ep.aux, subjEn, ...ep.tail, ...rest);
    else out.push(doAux, subjEn, ep.L.b, ...ep.tail, ...rest);
    return cap(out.join(' ')) + '?';
  }
  // decl / sub
  const pre = [];
  if(spec.kind==='sub'){ pre.push(spec.connEn); }
  if(spec.relPron){ pre.push(spec.relEn || 'that'); }
  if(spec.relPron && !spec.relSubjIsHead){ /* head noun already placed by caller */ }
  const A = advMid ? [adv.en] : [];
  if(ep.aux){
    const auxTxt = neg ? (ep.aux==='can' ? 'cannot' : ep.aux+' not') : ep.aux;
    out.push(subjEn, auxTxt, ...A, ...ep.tail, ...rest, ...advEnd);
    return finishEN(spec, pre, out.join(' '));
  }
  if(neg) out.push(subjEn, doAux, 'not', ep.L.b, ...ep.tail, ...rest, ...advEnd);
  else out.push(subjEn, ...A, lexFinite, ...ep.tail, ...rest, ...advEnd);
  return finishEN(spec, pre, out.join(' '));
}
function finishEN(spec, pre, s){
  s = s.replace(/\s+/g,' ').trim();
  pre = pre.filter(Boolean);
  if(spec.kind==='sub' || spec.relPron) return (pre.length? pre.join(' ')+' ' : '') + s;
  return cap(s) + '.';
}

/* ---------- render ---------- */
function fixCase(tokens){
  // sentence-initial capital; keep nouns/names/Sie as they are
  const t = tokens.slice(); t[0] = cap(t[0]); return t;
}
function render(spec){
  const toks = fixCase(buildDE(spec));
  const punct = endPunct(spec);
  const de = toks.join(' ') + punct;
  let en = buildEN(spec);
  return {de, en, tokens:toks, spec, punct};
}

/* ---------- spec factory ---------- */
function allowedTenses(level, kind){
  const t = ['pres'];
  if(level>=2) t.push('perf','pret');
  return t;
}
function makeSpec(o){
  o = o || {};
  const lvl = o.level || 1;
  for(let attempt=0; attempt<60; attempt++){
    const kind = o.kind || 'decl';
    const subj = o.subj || randomSubject();
    let tense = o.tense || 'pres';
    let modal = o.modal===undefined ? null : o.modal;
    if(tense==='perf' || tense==='k2') modal = null;
    if(o.randomModal && (tense==='pres'||tense==='pret') && chance(o.randomModal)) modal = pick(tense==='pret' ? MODALS_PRET : MODALS_PRES.filter(x=>lvl>=2 || ['können','müssen','wollen','möchten'].includes(x)));
    const filter = v => {
      if(o.filter && !o.filter(v)) return false;
      if(modal && (v.kind==='be' || v.inf==='haben' || v.noModal)) return false;
      if(!modal && tense==='perf' && (v.noPerf || v.kind==='be')) return false;
      if(!modal && tense==='pret' && !(v.inf==='sein' || v.inf==='haben')) return false;
      if(tense==='k2' && modal) return false;
      return true;
    };
    const p = makePred(lvl, {filter, verb:o.verb, noAdj:o.noAdj, noun:o.noun});
    if(!p) continue;
    let neg = !!o.neg;
    if(o.randomNeg && chance(o.randomNeg)) neg = true;
    if(neg && p.v.noNeg) neg = false;
    if(tense==='pret' && modal && !MODALS_PRET.includes(modal)) continue;
    // negation: kein- for indefinite objects
    if(neg){
      p.groups = p.groups.map(g => g.k==='obj' && (g.np && (g.np.det==='indef'||g.np.det==='none') ) ? toNeg(g) : g);
      if(p.groups.some(g=>g.k==='obj' && g.np && g.np.det==='none' && !g.negd && g.np.pl===false && g.noun.mass===false)) continue;
    }
    let adv = null, front = null;
    if(kind==='decl' && o.adv!==false && tense!=='k2' && tense!=='pass'){
      const want = o.adv===true || (o.cx>=2 && chance(0.55));
      if(want){
        const pool = (tense==='perf' || tense==='pret') ? PAST_TIME : PRES_TIME.filter(a => !(neg && a.mid) && !(p.v.inf==='wohnen' && a.de[0]!=='jetzt') && !(p.v.stative && a.k==='fut'));
        adv = pick(pool);
        if(!adv.mid && chance(0.4)) front = 'adv';
      }
    }
    const spec = {kind, subj, p, tense, modal, neg, adv, front};
    return spec;
  }
  return null;
}

/* ---------- complex sentences ---------- */
const WEATHER = [
  {de:['es','regnet'], en:'it rains', mains:[{verb:'bleiben'},{verb:'nehmen',noun:'Regenschirm'}]},
  {de:['es','schneit'], en:'it snows', mains:[{verb:'bleiben'},{verb:'tragen',noun:'Mantel'}]},
  {de:['die','Sonne','scheint'], en:'the sun shines', mains:[{verb:'gehen',noun:'Park'},{verb:'trinken',noun:'Saft'}]},
  {de:['es','kalt','ist'], en:'it is cold', mains:[{verb:'tragen',noun:'Jacke'},{verb:'trinken',noun:'Tee'},{verb:'bleiben'}]},
  {de:['es','heiß','ist'], en:'it is hot', mains:[{verb:'trinken',noun:'Wasser'},{verb:'gehen',noun:'Park'}]}
];
const REASON_VERBS = ['arbeiten','lernen','einkaufen','aufstehen','kochen','aufräumen'];
const nounByDe = de => NOUNS.find(n => n.de===de);
function reasonClause(lvl, conn, subj){
  const connEn = {weil:'because', wenn:'when', obwohl:'although'}[conn];
  for(let i=0;i<40;i++){
    const r = rnd();
    const spec = {kind:'sub', conn, connEn, subj, tense:'pres', modal:null, neg:false, adv:null, front:null};
    if(r<0.35){ const p = makePred(lvl,{verb:'sein'}); if(!p) continue; spec.p=p; spec.neg = chance(0.2); }
    else if(r<0.65){ spec.modal='müssen'; const p = makePred(lvl,{verb:pick(REASON_VERBS)}); if(!p) continue; spec.p=p; }
    else if(r<0.85){ const p = makePred(lvl,{verb:'haben', noun:nounByDe(pick(['Zeit','Geld']))}); if(!p) continue; spec.p=p; spec.neg = chance(0.5); }
    else if(lvl>=2){ spec.tense='perf'; const p = makePred(lvl,{verb:pick(['arbeiten','lernen'])}); if(!p) continue; spec.p=p; }
    else continue;
    if(spec.neg){ spec.p.groups = spec.p.groups.map(g=>g.k==='obj' && g.np && (g.np.det==='indef'||g.np.det==='none') ? toNeg(g) : g); if(spec.p.v.noNeg) spec.neg=false; }
    return {tokens:buildDE(spec), en:buildEN(spec), spec};
  }
  return null;
}
function subClause(lvl, conn, o){
  o = o || {};
  const connEn = {weil:'because', dass:'that', wenn:'when', obwohl:'although'}[conn];
  if(o.subj && conn!=='dass') return reasonClause(lvl, conn, o.subj);
  for(let i=0;i<40;i++){
    const r = rnd();
    const subj = o.subj || randomSubject();
    const spec = {kind:'sub', conn, connEn, subj, tense:'pres', modal:null, neg:chance(0.2), adv:null, front:null};
    if(r<0.3){ const p=makePred(lvl,{verb:'sein'}); if(!p) continue; spec.p=p; }

    const fi = segs.findIndex(s=>s.r==='finite');
    const cc = cloneSegs(segs); const f = cc.splice(fi,1)[0]; cc.splice(2, 0, f);          // conn, subj, FINITE ...

function variants(spec, want){

  attempts.push(() => { const s = clone(); if(s.p.v.noNeg) return null; s.neg = !s.neg; if(s.neg) s.p.groups = s.p.groups.map(g => g.k==='obj' && g.np && (g.np.det==='indef'||g.np.det==='none') ? DE.toNeg(g) : g); else { s.p.groups = s.p.groups.map(g => g.negd ? Object.assign({}, g, {negd:false, np:DE.np(g.noun,{det:(g.noun.mass||g.np.pl)?'none':'indef',case:g.np.case,pl:g.np.pl,adj:g.np.adj})}) : g).map(g => g.np && !g.negd && g.de!==g.np.de ? Object.assign({}, g, {de:g.np.de, en:g.np.en}) : g); } return s; });
  // object / place noun
  attempts.push(() => {

    if(gi>=0){ const g = s.p.groups[gi]; const pool = DE.nounsBy(s.p.v.obj.split(' '), 3, n => n!==g.noun && (!g.np.pl || n.pl) && n.art===g.noun.art === false || true).filter(n => n!==g.noun && (!g.np.pl || n.pl));
      if(!pool.length) return null; const n = pick(pool); s.p.groups[gi] = DE.objGroup(s.p.v, 3, {noun:n, det:g.np.det==='neg'?'indef':g.np.det, pl:g.np.pl}); if(g.negd) s.p.groups[gi] = DE.toNeg(s.p.groups[gi]); return s; }
    const pi = s.p.groups.findIndex(g=>g.k==='dir' && g.noun || g.k==='loc' && g.noun);
    if(pi>=0){ const g = s.p.groups[pi]; const n = pick(DE.NOUNS.filter(x=>x.dir && x!==g.noun && x.t.includes(s.p.v.kind==='work'?'work':'go'))); if(!n) return null; s.p.groups[pi] = g.k==='dir' ? DE.dirPlaceGroup(n) : DE.locPlaceGroup(n); return s; }

  if(!/[.!?]\s*$/m.test(t.trim().split('\n').slice(-3).join(' ')) && !/Grüße|Gruß|Tschüss|gleich|bald/i.test(t)) res.tips.push('End your sentences with punctuation.');

  const done = res.items.filter(i=>i.ok).length;
  const content = res.items.length ? done / res.items.length : 1;
  const length = Math.min(1, words / task.minWords);
  const accuracy = Math.max(0, 1 - res.tips.filter(x => !/words|connectors|B1 level/.test(x)).length * 0.2);

  if(done===res.items.length && res.items.length) res.good.push('All required content points are covered.');
  if(words >= task.minWords) res.good.push('Good length (' + words + ' words).');
  return res;
}

    catch (e) { el.innerHTML = '<div class="card">' + (e.offline ? 'No internet connection.' : E(e.message)) + '</div>'; return; }
    const last = subs[0], s = last ? (last.summary || {}) : {};
    let pay = null;
    if (last) { try { const d = await admRest('submissions?id=eq.' + encodeURIComponent(last.id) + '&select=payload'); pay = d[0] && d[0].payload; } catch (e) {} }
    pay = pay || {};
    const skills = Object.assign({}, ...Object.entries(s.grammar || {}).map(([k, v]) => ({['g:' + k]: {done: v.n, correct: v.ok}})), ...Object.entries(s.skills || {}).map(([k, v]) => ({[k]: v})));
    const skillRows = Object.entries(skills).filter(([, v]) => v.done > 0).sort((a, b) => (a[1].correct / a[1].done) - (b[1].correct / b[1].done));
    el.innerHTML = `<div class="row"><button class="btn ghost small" id="admBack">← Students</button></div>
      <h2>${E(row.full_name || row.email || 'Student')}</h2><div class="mini-muted">${E(row.email || '')}</div>
      <div style="margin:10px 0">${row.approved ? '<span class="sp-badge ok">approved</span>' : '<span class="sp-badge warn">pending</span>'} ${overdue(row) ? '<span class="sp-badge bad">overdue</span>' : ''}
        <button class="btn tiny" id="admApprove">${row.approved ? 'Disable account' : 'Approve account'}</button></div>
      ${last ? `<div class="sp-grid">
        <div class="sp-stat"><b>${E(pctOf(s.correct_7d, s.answers_7d))}</b>accuracy (7 d)</div><div class="sp-stat"><b>${E(s.answers_7d | 0)}</b>answers (7 d)</div>
        <div class="sp-stat"><b>${E(s.active_days_7d | 0)}/7</b>active days</div><div class="sp-stat"><b>${E(s.streak | 0)}</b>day streak</div>
        <div class="sp-stat"><b>${E(fmtMin(s.study_seconds_total))}</b>study time</div><div class="sp-stat"><b>${E(s.words_known | 0)}</b>words known</div></div>
        ${s.clock_rewinds ? `<div class="sp-badge bad">device clock moved back ${E(s.clock_rewinds)}×</div>` : ''}
        <h3>Skills (weakest first)</h3><div class="card" style="overflow-x:auto"><table class="sp-table">${skillRows.length ? skillRows.slice(0, 14).map(([k, v]) => `<tr><td>${E(k)}</td><td>${E(pctOf(v.correct, v.done))}</td><td class="mini-muted">${E(v.correct)}/${E(v.done)}</td></tr>`).join('') : '<tr><td class="mini-muted">No data yet.</td></tr>'}</table></div>
        <h3>Frequent mistakes</h3><div class="card">${(pay.mistakes || []).slice(0, 10).map(m => `<div style="margin-bottom:10px"><div class="mini-muted">${E(m.topic)} · ${E(m.count)}×</div><div>${E(m.prompt)}</div><div class="mini-muted">answered “${E(m.you)}” — correct “${E(m.correct)}”</div></div>`).join('') || '<span class="mini-muted">None.</span>'}</div>
        <h3>Writing samples</h3><div class="card">${(pay.writing || []).slice(-4).reverse().map(w => `<div style="margin-bottom:14px"><div><b>${E(w.title)}</b> <span class="sp-badge">${E(w.level)}</span> <span class="sp-badge ${w.score >= 70 ? 'ok' : 'warn'}">${E(w.score)}/100</span> <span class="mini-muted">${E(w.words)} words</span></div><div class="sp-pre">${E(w.text)}</div></div>`).join('') || '<span class="mini-muted">None.</span>'}</div>` : '<div class="card mini-muted">This student has not synced yet.</div>'}
      <h3>Submissions</h3><div id="admSubs">${subs.map(x => `<div class="card" data-sub="${E(x.id)}"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${E(new Date(x.created_at).toLocaleString())}</b><span class="sp-badge ${x.review_status === 'pending' ? 'warn' : x.review_status === 'flagged' ? 'bad' : 'ok'}">${E(x.review_status)}</span></div>
        <div class="mini-muted">${E((x.summary && x.summary.answers_7d) || 0)} answers (7 d) · ${E(pctOf(x.summary && x.summary.correct_7d, x.summary && x.summary.answers_7d))}</div>
        <label class="mini-muted" for="rn-${E(x.id)}">Feedback to student</label><textarea id="rn-${E(x.id)}" maxlength="2000" rows="2" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)">${E(x.review_note || '')}</textarea>
        <div class="row" style="margin-top:8px"><select data-rate="${E(x.id)}"><option value="">Rating</option>${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${x.rating === n ? 'selected' : ''}>${'★'.repeat(n)}</option>`).join('')}</select>
          <button class="btn tiny" data-rev="${E(x.id)}" data-st="reviewed">Mark reviewed</button><button class="btn tiny ghost" data-rev="${E(x.id)}" data-st="flagged">Flag</button></div></div>`).join('') || '<div class="mini-muted">No submissions.</div>'}</div>`;
    el.querySelector('#admBack').onclick = () => { adm.sel = null; window.viewAdmin(el); };
    el.querySelector('#admApprove').onclick = async () => {
      try { await admRest('profiles?id=eq.' + encodeURIComponent(id), {method: 'PATCH', body: {approved: !row.approved}, headers: {Prefer: 'return=minimal'}}); row.approved = !row.approved; admStudent(el, id); }
      catch (e) { toast(e.offline ? 'No internet connection.' : trunc(e.message, 100)); }
    };
    el.querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => {
      const sid = b.dataset.rev, note = el.querySelector('#rn-' + sid).value.slice(0, 2000), r = el.querySelector('[data-rate="' + sid + '"]').value;
      try {
        await admRest('submissions?id=eq.' + encodeURIComponent(sid), {method: 'PATCH', headers: {Prefer: 'return=minimal'}, body: {review_status: b.dataset.st, review_note: note || null, rating: r ? +r : null, reviewed_at: new Date().toISOString(), reviewed_by: auth.user.id, student_seen: false}});
        toast('Saved'); admStudent(el, id);
      } catch (e) { toast(e.offline ? 'No internet connection.' : trunc(e.message, 100)); }
    });
  }

  /* ---------------- boot ---------------- */
  function syncNav() {
    if (typeof NAV === 'undefined') return;
    const i = NAV.findIndex(n => n[0] === 'admin');
    if (isAdmin() && i < 0) NAV.splice(1, 0, ['admin', 'nav_admin']);
    if (!isAdmin() && i >= 0) NAV.splice(i, 1);
    try { UI.en.nav_admin = '🛡️ Admin'; UI.gu.nav_admin = '🛡️ Admin'; } catch (e) {}
    if (typeof buildNav === 'function') buildNav();
  }
  function tick() { touchClock(); renderLock(); renderChip(); if (isStudent() && auth.profile.approved && online() && (sync.dirty || lockState().warn) && Date.now() - (sync.lastAttempt || 0) > 10 * 60000) syncNow(false).catch(() => {}); }
  function startServices() {
    css(); syncNav(); renderChip(); touchClock(); renderLock();
    if (!STORE.__spWrapped) { const orig = STORE.save.bind(STORE); STORE.save = function () { orig(); markDirty(); }; STORE.__spWrapped = true; }
    clearInterval(timer); timer = setInterval(tick, 60000);
    if (!window.__spListeners) { window.__spListeners = true; window.addEventListener('online', tick); document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); }); }
    if (online() && auth && auth.refresh_token) loadProfile().then(() => { syncNav(); renderChip(); renderLock(); }).catch(e => { if (e.status === 400 || e.status === 404) signOut(); });
  }
  function stopServices() { clearInterval(timer); clearTimeout(syncTimer); const c = document.getElementById('spChip'); if (c) c.textContent = ''; const a = document.getElementById('spAcct'); if (a) a.remove(); if (c) c.remove(); }

  function pendingEmailLink() {
    const p = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));
    const type = p.get('type') || '';
    if (!['magiclink', 'email', 'signup'].includes(type)) return null;
    const access_token = p.get('access_token'), refresh_token = p.get('refresh_token');
    if (!access_token || !refresh_token) return null;
    return {access_token, refresh_token, expires_in: Number(p.get('expires_in')) || 3600};
  }
  async function consumeEmailLink(link) {
    try {
      // Get the authoritative user from Auth before creating a local session.
      const r = await http('/auth/v1/user', {token: link.access_token});
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      auth = null;
      setSession({access_token: link.access_token, refresh_token: link.refresh_token,
        expires_in: link.expires_in, user: r.data});
      await loadProfile();
      sync = {uid: auth.user.id};
      touchClock(true); ls.set(K_SYNC, sync);
      await finishLogin(auth.profile);
    } catch (e) {
      auth = null; ls.del(K_AUTH);
      showLogin(e.offline ? 'No internet connection. Open the email link again when online.' :
        'That email link expired or was already used. Request a new email and open the newest link.');
    }
  }

  window.SP_AUTH = Object.assign(window.SP_AUTH, {syncNow, lockState, signOut, buildSnapshot, isAdmin, isTeacher, isStudent, _state: () => ({auth, sync})});
  css();
  const emailLink = pendingEmailLink();
  if (emailLink) {
    showLogin('Verifying your email sign-in link…');
    consumeEmailLink(emailLink);
  } else if (!auth || !auth.refresh_token) { showLogin(); }
  else { adoptUser(auth.user.id); startServices(); }
})();

$('#themeBtn').onclick = e => { e.preventDefault(); e.stopPropagation(); S.settings.theme = (S.settings.theme === 'dark') ? 'light' : 'dark'; STORE.save(); applyTheme(); };
$('#langBtn').onclick = e => { e.preventDefault(); e.stopPropagation(); S.settings.lang = (S.settings.lang === 'gu') ? 'en' : 'gu'; STORE.save(); applyLanguage(true); };
$('#settingsBtn').onclick = e => {
  e.preventDefault();
  e.stopPropagation();
  /* Staff dashboards use their own hash routes. Do NOT change the hash here:
     another LMS/auth route refresh can immediately overwrite #/settings. Render
     the settings view directly and leave the staff dashboard route untouched. */
  if (window.SP_LMS && window.SP_LMS.isStaff && window.SP_LMS.isStaff()) {
    if (typeof viewSettings === 'function') viewSettings($('#view'));
    return false;
  }
  location.hash = '#/settings';
};

buildNav();
applyTheme();
applySettingsToDOM();
applyLanguage(false);
route();</script>
<script>/* PWA registration + Android native helpers (share sheet for exports) */
(function(){
  var cap = window.Capacitor, native = cap && cap.isNativePlatform && cap.isNativePlatform();

  // The Android build loads the web app from GitHub Pages. Registering the
  // service worker there gives the installed APK the same offline cache and
  // lets HTML/CSS/JS updates arrive without reinstalling the APK.
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js', {scope:'./'}).then(function(reg){
        if (reg.update) reg.update().catch(function(){});
      }).catch(function(){});
    });
  }

  if(!native) return;
  document.addEventListener('click', function(ev){
    var a = ev.target.closest && ev.target.closest('a[download]');
    if(!a || !/^blob:/.test(a.href)) return;
    ev.preventDefault(); ev.stopPropagation();
    var name = a.getAttribute('download') || 'sprachtreppe-export.json';
    fetch(a.href).then(function(r){return r.blob();}).then(function(b){
      return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(',')[1]);};fr.onerror=rej;fr.readAsDataURL(b);});
    }).then(function(b64){
      var P = cap.Plugins;
      return P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'}).then(function(w){
        return P.Share.share({title:name,url:w.uri,dialogTitle:'Save or send'});
      });
    }).catch(function(e){ if(e && /cancel/i.test(String(e.message||e))) return; alert('Export failed: '+(e&&e.message||e)); });
  }, true);
})();
</script></body>
