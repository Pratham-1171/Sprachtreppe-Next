<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sprachtreppe — German A1–B1</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#1a1c22;--muted:#6b7280;--line:#e4e7eb;--accent:#1e6feb;--accent2:#0d9488;--warn:#e11d48;--ok:#16a34a;--gold:#d97706;--shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);--header-h:56px;--radius:14px;--tap:44px;--pad-x:clamp(12px,2.5vw,26px);--max-w:1180px;--f-base:clamp(14px,.35vw + 12.8px,15.5px);--f-h2:clamp(18px,1vw + 14.5px,22px);--f-h3:clamp(15px,.5vw + 13.5px,17px)}
html[data-theme="dark"]{--bg:#13161c;--card:#1b1f28;--text:#e9ecf2;--muted:#a2a9b8;--line:#2a303c;--accent:#6fa8ff;--accent2:#4dd4c0;--warn:#f46a87;--ok:#4ade80;--gold:#fbbf24;--shadow:0 1px 3px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.3)}
html[data-fontsize="small"]{--f-base:13px;--f-h2:18px;--f-h3:15px}
html[data-fontsize="large"]{--f-base:17px;--f-h2:24px;--f-h3:19px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:var(--f-base)/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Gujarati",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);min-height:100dvh;display:flex;flex-direction:column}
button,a,input,select,textarea{touch-action:manipulation;font-family:inherit}
header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);padding:0 var(--pad-x);display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top);height:calc(var(--header-h) + env(safe-area-inset-top));flex:0 0 auto}
.logo{font-weight:800;letter-spacing:-.3px;white-space:nowrap;font-size:clamp(13.5px,.7vw + 11.2px,16px)}
.logo span{color:var(--accent)}
header .spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line);color:var(--text);width:40px;height:40px;border-radius:10px;cursor:pointer;display:grid;place-items:center;font-size:15px;font-weight:700;transition:.15s;flex:0 0 auto}
.iconbtn:hover{background:var(--bg);border-color:var(--accent)}
.langbtn{min-width:68px;font-size:12px}
nav{position:sticky;top:calc(var(--header-h) + env(safe-area-inset-top));z-index:49;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:0 0 auto}
nav::-webkit-scrollbar{display:none}
nav .inner{display:inline-flex;padding:0 max(8px,var(--pad-x));gap:2px;min-width:100%}
nav button{background:none;border:none;color:var(--muted);font:inherit;font-size:clamp(12.5px,.25vw + 11.9px,13.5px);font-weight:600;padding:12px;cursor:pointer;border-bottom:2.5px solid transparent;transition:.15s;white-space:nowrap;min-height:var(--tap);display:inline-flex;align-items:center}
nav button.active{color:var(--accent);border-bottom-color:var(--accent)}
html[data-compactnav="1"] nav button{padding:9px 8px;font-size:12px}
main{max-width:var(--max-w);margin:0 auto;width:100%;padding:clamp(14px,2vw,26px) var(--pad-x) 26px;flex:1 0 auto}
h2{font-size:var(--f-h2);letter-spacing:-.3px;margin-bottom:4px;line-height:1.25}
h3{font-size:var(--f-h3);margin:18px 0 8px}
h4{font-size:clamp(14px,.4vw + 12.8px,15.5px);margin:12px 0 6px}
.sub{color:var(--muted);font-size:clamp(12.5px,.2vw + 12px,13.5px);margin-bottom:14px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(12px,1.6vw,16px);margin-bottom:12px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:clamp(8px,1vw,12px)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(12px,1.4vw,16px);cursor:pointer;transition:.15s;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);min-height:var(--tap);color:var(--text);font:inherit}
.tile:hover{border-color:var(--accent)}
.tile .t-ico{font-size:clamp(18px,1vw + 14px,22px)}
.tile .t-name{font-weight:700;font-size:clamp(13.5px,.4vw + 12.5px,14.5px)}
.tile .t-desc{color:var(--muted);font-size:11.5px;line-height:1.35}
input[type=text],input[type=search],select,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;outline:none;min-height:var(--tap);-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,111,235,.12)}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto !important;min-width:0}
.btn{background:var(--accent);color:#fff;border:none;padding:12px 18px;border-radius:10px;font:inherit;font-weight:650;font-size:14px;cursor:pointer;transition:.15s;min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.small{padding:8px 12px;font-size:12.5px;border-radius:8px;min-height:36px}
.btn.tiny{padding:6px 10px;font-size:11.5px;min-height:30px;border-radius:7px}
.btn.good{background:var(--ok)}
.btn.bad{background:var(--warn)}
.chipgroup{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);flex-wrap:wrap}
.chipgroup button{padding:9px 14px;border:none;background:none;color:var(--text);font:inherit;font-size:13px;cursor:pointer;border-right:1px solid var(--line);min-height:38px;font-weight:600;transition:.15s}
.chipgroup button:last-child{border-right:none}
.chipgroup button.active{background:var(--accent);color:#fff}
.vlist{display:flex;flex-direction:column;gap:6px}
.vrow{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:11px}
.vrow .vnum{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.vrow .vde{font-weight:650;font-size:14.5px;word-break:break-word}
.vrow .ven{color:var(--muted);font-size:12.5px;text-align:right;display:flex;align-items:center;gap:4px;justify-content:flex-end}
.art{display:inline-block;font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px;margin-right:6px;vertical-align:1px;letter-spacing:.3px}
.art.der{background:#dbeafe;color:#1d4ed8}
.art.die{background:#fee2e2;color:#b91c1c}
.art.das{background:#dcfce7;color:#15803d}
html[data-theme="dark"] .art.der{background:#1e3a8a;color:#c7d9ff}
html[data-theme="dark"] .art.die{background:#7f1d1d;color:#ffd1d1}
html[data-theme="dark"] .art.das{background:#14532d;color:#c9f7d3}
.bookmark{background:none;border:none;cursor:pointer;font-size:17px;opacity:.4;padding:6px;min-width:32px;min-height:32px;display:grid;place-items:center;border-radius:8px;color:var(--text)}
.bookmark.on{opacity:1;color:var(--gold)}
.speak-btn{background:none;border:none;cursor:pointer;font-size:15px;opacity:.65;padding:6px;min-width:32px;min-height:32px;display:grid;place-items:center;border-radius:8px;color:var(--accent)}
.speak-btn:active{transform:scale(.9)}
.flash-wrap{perspective:1200px;max-width:560px;margin:10px auto}
.flash{position:relative;width:100%;min-height:clamp(200px,42vh,260px);transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.flash.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(18px,3vw,28px);text-align:center;box-shadow:var(--shadow);overflow:hidden}
.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,var(--card),var(--bg))}
.face .big{font-size:clamp(20px,2vw + 14px,28px);font-weight:750;margin-bottom:8px;word-break:break-word}
.face .big-en{font-size:clamp(15px,1vw + 12px,19px);font-weight:600;color:var(--accent2);margin-bottom:8px}
.face .small{color:var(--muted);font-size:12.5px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;font:inherit;font-size:14px;color:var(--text);cursor:pointer;transition:.15s;min-height:var(--tap);word-break:break-word}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:rgba(22,163,74,.09);font-weight:650}
.opt.wrong{border-color:var(--warn);background:rgba(225,29,72,.09)}
.opt:disabled{cursor:default}
.qstat{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .n{font-size:clamp(20px,1.5vw + 16px,24px);font-weight:800;color:var(--accent);line-height:1.1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:4px}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.tag.A1{background:#dbeafe;color:#1d4ed8}
.tag.A2{background:#fef3c7;color:#b45309}
.tag.B1{background:#fce7f3;color:#be185d}
html[data-theme="dark"] .tag.A1{background:#1e3a8a;color:#c7d9ff}
html[data-theme="dark"] .tag.A2{background:#78350f;color:#fde68a}
html[data-theme="dark"] .tag.B1{background:#831843;color:#fbcfe8}
.passage{line-height:1.75;font-size:14.5px}
.passage p{margin-bottom:12px}
.qa{margin-top:14px}
.qa .q{font-weight:650;margin-bottom:8px;font-size:14px;line-height:1.5}
.hidden{display:none !important}
.center{text-align:center}
.mt{margin-top:14px}
.pill{display:inline-block;font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin:0 4px 4px 0}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
.mini-muted{color:var(--muted);font-size:13px;line-height:1.5}
footer{flex:0 0 auto;width:100%;margin-top:24px;padding:18px max(16px,var(--pad-x)) calc(24px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:12px;line-height:1.5;border-top:1px solid var(--line);background:var(--card)}
footer .foot-brand{font-weight:700;color:var(--text)}
footer .foot-sub{font-size:11.5px;margin-top:2px}
footer .foot-ver{font-size:10.5px;opacity:.7;margin-top:4px}
.res-card{display:flex;gap:14px;align-items:flex-start}
.res-card .res-icon{font-size:24px;flex-shrink:0;width:42px;text-align:center}
.res-card .res-body{flex:1;min-width:0}
.res-card h4{margin-bottom:3px}
.res-card .res-url{font-size:12px;color:var(--accent);word-break:break-all;margin-bottom:6px}
.res-card .res-url a{color:var(--accent);text-decoration:none}
.res-card .res-desc{font-size:13px;color:var(--muted);line-height:1.55}
.today-dash{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:18px;border-radius:16px;margin-bottom:14px}
.today-dash h3{color:#fff;margin:0 0 4px;font-size:18px}
.today-dash .td-sub{color:rgba(255,255,255,.85);font-size:12.5px;margin-bottom:10px}
.streak-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);padding:5px 12px;border-radius:99px;font-size:12.5px;font-weight:700;margin-bottom:10px}
.goal-bar{height:12px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin-top:8px}
.goal-bar>i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s}
.today-dash .td-stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:10px}
.today-dash .td-stats span{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:99px}
.srs-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.srs-btn{padding:12px 4px;border:none;border-radius:11px;font:inherit;font-weight:700;cursor:pointer;font-size:12px;color:#fff;display:flex;flex-direction:column;gap:3px;align-items:center}
.srs-btn .srs-emoji{font-size:18px}
.srs-btn.again{background:#ef4444}
.srs-btn.hard{background:#f97316}
.srs-btn.good{background:#22c55e}
.srs-btn.easy{background:#0ea5e9}
.mistake-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:var(--card)}
.mistake-card .mc-prompt{font-size:14px;line-height:1.5;margin-bottom:6px}
.mistake-card .mc-user{color:var(--warn);font-weight:600;font-size:13.5px}
.mistake-card .mc-correct{color:var(--ok);font-weight:600;font-size:13.5px}
.mistake-card .mc-meta{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mastery-chip{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.4px;text-transform:uppercase}
.mastery-NEW{background:#e5e7eb;color:#4b5563}
.mastery-LEARNING{background:#fef3c7;color:#b45309}
.mastery-FAMILIAR{background:#dbeafe;color:#1d4ed8}
.mastery-STRONG{background:#dcfce7;color:#15803d}
.mastery-MASTERED{background:#a855f7;color:#fff}
html[data-theme="dark"] .mastery-NEW{background:#374151;color:#d1d5db}
html[data-theme="dark"] .mastery-LEARNING{background:#78350f;color:#fde68a}
.session-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.session-card .sc-type{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.5px;text-transform:uppercase}
.session-progress{display:flex;gap:4px;margin-bottom:10px}
.session-progress .sp-dot{flex:1;height:5px;background:var(--line);border-radius:99px}
.session-progress .sp-dot.done{background:var(--ok)}
.session-progress .sp-dot.current{background:var(--accent)}
.family-tree{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;background:var(--bg);padding:14px;border-radius:10px;line-height:1.8;overflow-x:auto;white-space:pre-wrap}
.builder-tiles{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;min-height:40px}
.builder-tile{padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;cursor:pointer;min-height:38px;color:var(--text)}
.builder-tile:hover{border-color:var(--accent)}
.builder-tile.used{opacity:.3;pointer-events:none}
.builder-answer{min-height:56px;padding:12px;background:var(--bg);border:2px dashed var(--line);border-radius:11px;font-size:15px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;line-height:1.4}
.builder-answer .word{padding:6px 11px;background:var(--card);border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:14px}
.spell-input{width:100%;padding:16px;font-size:20px;text-align:center;border-radius:12px;border:2px solid var(--line);font-family:inherit;background:var(--card);color:var(--text);outline:none}
.spell-input:focus{border-color:var(--accent)}
.spell-input.correct{border-color:var(--ok);background:rgba(22,163,74,.08)}
.spell-input.wrong{border-color:var(--warn);background:rgba(225,29,72,.08)}
.achievement{display:flex;gap:12px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:11px;margin-bottom:6px;align-items:center}
.achievement.locked{opacity:.45;filter:grayscale(1)}
.achievement .ach-icon{font-size:22px;flex-shrink:0;width:34px;text-align:center}
.achievement .ach-name{font-weight:650;font-size:13.5px}
.achievement .ach-desc{font-size:11.5px;color:var(--muted);margin-top:2px}
.exam-box{background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:14px;margin-bottom:12px}
.exam-timer{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:800;color:var(--warn);letter-spacing:1px}
.collo-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.collo-card .cc-phrase{font-weight:700;font-size:15px;color:var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.collo-card .cc-en{color:var(--muted);font-size:12.5px;margin-top:3px}
.collo-card .cc-ex{background:var(--bg);border-left:3px solid var(--accent2);padding:8px 11px;border-radius:6px;font-size:13.5px;line-height:1.55;margin-top:8px}
.cmp-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.cmp-card .cmp-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.cmp-card .cmp-word{font-weight:800;font-size:16px;color:var(--accent)}
.cmp-card .cmp-vs{color:var(--muted);font-weight:700;font-size:12px}
.cmp-card .cmp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.cmp-card .cmp-side{background:var(--bg);border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.5}
.cmp-card .cmp-side b{color:var(--accent2);display:block;margin-bottom:4px}
.cmp-card .cmp-note{margin-top:10px;font-size:12.5px;color:var(--muted);background:var(--bg);padding:8px 11px;border-radius:8px;border-left:3px solid var(--gold)}
.conn-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.conn-card .cn-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.conn-card .cn-word{font-weight:750;font-size:15.5px;color:var(--accent);display:flex;align-items:center;gap:8px}
.conn-card .cn-func{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--bg);color:var(--muted)}
.conn-card .cn-meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.conn-card .cn-ex{background:var(--bg);border-radius:7px;padding:8px 11px;font-size:13.5px;line-height:1.55;margin-top:6px}
.settings-section{margin-bottom:18px}
.settings-section h4{margin:0 0 10px;font-size:13.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.setting-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.setting-row .sr-label{font-size:13.5px;font-weight:600}
.setting-row select,.setting-row input[type=text]{min-width:140px;padding:8px 10px;min-height:36px;font-size:13px}
.setting-row .switch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0}
.setting-row .switch input{opacity:0;width:0;height:0}
.setting-row .switch span{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--line);transition:.2s;border-radius:99px}
.setting-row .switch span:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;transition:.2s;border-radius:50%}
.setting-row .switch input:checked + span{background:var(--accent)}
.setting-row .switch input:checked + span:before{transform:translateX(20px)}
.setup-panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:14px}
.setup-panel .sp-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin-bottom:10px}
.setup-panel .sp-row:last-child{margin-bottom:0}

.card {border:0;border-bottom:1px solid var(--line);padding:18px 0;border-radius:0;box-shadow:none;}
.card .card {border:0;}

.activity-report {margin:22px 0 30px;}
.activity-week {display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:14px 0 20px;}
.activity-week>div {padding:14px 3px;text-align:center;border:1px solid var(--line);border-radius:6px;background:color-mix(in oklch,var(--accent2) 12%,var(--card));}
.activity-week strong {display:block;font:600 22px 'Lora',Georgia,'Times New Roman',serif;}

.today-dash .td-sub {color:var(--muted);}
.goal-bar {background:var(--line);}

    {title:'Indefinite articles — ein/eine', explanation:'Use ein/eine for “a/an”. The ending depends on the noun’s gender and grammatical case. The plural usually has no indefinite article.', rule:'Nominativ:\nein Mann · eine Frau · ein Kind\nAkkusativ:\neinen Mann · eine Frau · ein Kind', examples:[['Das ist ein Tisch.','That is a table.'],['Sie kauft eine Tasche.','She buys a bag.'],['Er sieht einen Hund.','He sees a dog.']], mistakes:[['❌ Ich kaufe ein Apfel.','✅ Ich kaufe einen Apfel.']], exercise:{q:'Das ist ___ Buch.',options:['der','ein','eine'],correct:1,why:'Buch is neuter: ein Buch.'}},

    {title:'Separable verbs in the present', explanation:'Many common verbs have a prefix that separates in a main clause. Conjugate the verb stem and place the prefix at the end.', rule:'anrufen → Ich rufe dich an.\naufstehen → Ich stehe um sieben Uhr auf.\neinkaufen → Wir kaufen heute ein.', examples:[['Der Zug kommt um neun Uhr an.','The train arrives at nine.'],['Sie ruft ihre Mutter an.','She calls her mother.']], mistakes:[['❌ Ich anrufe dich.','✅ Ich rufe dich an.']], exercise:{q:'Ich ___ um sieben Uhr ___. (aufstehen)',options:['stehe / auf','aufstehe / —','auf / stehe'],correct:0,why:'The conjugated stem is in position 2; the prefix goes to the end.'}},
    {title:'Imperative — instructions and requests', explanation:'Use the imperative to give instructions or make requests. The form depends on whether you speak to du, ihr or Sie; polite Sie keeps the pronoun after the verb.', rule:'du: Komm! / Lies!\nihr: Kommt! / Lest!\nSie: Kommen Sie bitte! / Lesen Sie bitte!', examples:[['Mach bitte die Tür zu.','Please close the door.'],['Warten Sie einen Moment.','Please wait a moment.']], mistakes:[['❌ Bitte Sie warten.','✅ Warten Sie bitte.']], exercise:{q:'___ Sie bitte langsam!',options:['Sprechen','Sprich','Sprecht'],correct:0,why:'Formal request: infinitive form + Sie.'}},
    {title:'Possessives — nominative and accusative', explanation:'mein, dein, sein, ihr, unser, euer and Ihr tell who something belongs to. Their endings follow ein-words and change with gender, number and case.', rule:'Nom.: mein Bruder · meine Tasche · mein Kind\nAkk.: meinen Bruder · meine Tasche · mein Kind', examples:[['Das ist meine Schwester.','That is my sister.'],['Ich besuche meinen Bruder.','I am visiting my brother.']], mistakes:[['❌ Ich sehe mein Bruder.','✅ Ich sehe meinen Bruder.']], exercise:{q:'Ich sehe ___ Bruder.',options:['mein','meinen','meinem'],correct:1,why:'Bruder is masculine accusative: meinen Bruder.'}}
  ]
});

/* Add topics often needed in A2 courses and exams. */
GRAMMAR_DATA.push({
  level: 'A2', title: 'A2 Expanded Grammar', items: [
    {title:'Reflexive verbs', explanation:'Some verbs use a reflexive pronoun that refers back to the subject. The pronoun is usually accusative, but some verbs require dative when there is another accusative object.', rule:'ich interessiere mich\n du interessierst dich\ner/sie interessiert sich\nwir interessieren uns\nihr interessiert euch\nsie interessieren sich', examples:[['Ich interessiere mich für Musik.','I am interested in music.'],['Wir treffen uns um sechs Uhr.','We are meeting at six.']], mistakes:[['❌ Ich interessiere für Musik.','✅ Ich interessiere mich für Musik.']], exercise:{q:'Ich freue ___ auf das Wochenende.',options:['mich','mir','mein'],correct:0,why:'sich freuen auf normally uses an accusative reflexive pronoun.'}},
    {title:'Comparative and superlative', explanation:'Use the comparative to compare two things and the superlative for the highest degree. Many short adjectives add an umlaut; some forms are irregular.', rule:'schnell → schneller → am schnellsten\nalt → älter → am ältesten\ngut → besser → am besten\ncomparative + als\nso ... wie = equal', examples:[['Der Zug ist schneller als der Bus.','The train is faster than the bus.'],['Heute ist es so warm wie gestern.','Today it is as warm as yesterday.'],['Sie läuft am schnellsten.','She runs the fastest.']], mistakes:[['❌ größer wie ich','✅ größer als ich']], exercise:{q:'Mein Zimmer ist ___ als dein Zimmer. (klein)',options:['klein','kleiner','am kleinsten'],correct:1,why:'Use the comparative + als to compare two things.'}},
    {title:'Two-way prepositions — location or direction', explanation:'An, auf, hinter, in, neben, über, unter, vor and zwischen can take dative or accusative. Dative answers “where is it?”; accusative answers “where to?”.', rule:'Wo? + Dativ:\nDas Buch liegt auf dem Tisch.\nWohin? + Akkusativ:\nIch lege das Buch auf den Tisch.', examples:[['Die Kinder spielen im Garten.','The children are playing in the garden.'],['Die Kinder gehen in den Garten.','The children go into the garden.']], mistakes:[['❌ Ich lege das Buch auf dem Tisch.','✅ Ich lege das Buch auf den Tisch.']], exercise:{q:'Ich stelle die Tasse ___ Tisch. (auf + Wohin?)',options:['auf dem','auf den','auf der'],correct:1,why:'Placement toward a destination answers Wohin? and takes accusative.'}},
    {title:'Verb-preposition pairs', explanation:'Some verbs require a fixed preposition, and that preposition determines the case. Learn the verb, preposition and case together as one unit.', rule:'warten auf + Akk.\ndenken an + Akk.\nteilnehmen an + Dat.\nsich interessieren für + Akk.\nsprechen mit + Dat.', examples:[['Ich warte auf den Bus.','I am waiting for the bus.'],['Sie interessiert sich für Kunst.','She is interested in art.'],['Wir nehmen an dem Kurs teil.','We are taking part in the course.']], mistakes:[['❌ warten den Bus','✅ auf den Bus warten']], exercise:{q:'Ich interessiere mich ___ Musik.',options:['an','für','mit'],correct:1,why:'sich interessieren requires für + accusative.'}},
    {title:'da- and wo-compounds', explanation:'Use da(r)- compounds to refer to a thing or idea already mentioned and wo(r)- compounds to ask about that thing with a preposition. For people, use the preposition plus personal pronoun.', rule:'warten auf etwas → darauf warten\nsprechen über etwas → darüber sprechen\nWorauf wartest du?\nAuf wen wartest du? (person)', examples:[['Ich freue mich darauf.','I am looking forward to it.'],['Worüber sprecht ihr?','What are you talking about?'],['Auf wen wartest du?','Who are you waiting for?']], mistakes:[['❌ Auf was wartest du? (standard exam form)','✅ Worauf wartest du?']], exercise:{q:'___ freust du dich? — Auf die Ferien.',options:['Worauf','Wohin','Womit'],correct:0,why:'The verb sich freuen uses auf; ask about the thing with worauf.'}},
    {title:'Purpose — um ... zu and damit', explanation:'Use um ... zu + infinitive when the purpose-doer is the same as in the main clause. Use damit when the purpose clause has its own subject.', rule:'same subject: Ich lerne, um die Prüfung zu bestehen.\ndifferent subject: Ich spreche langsam, damit du mich verstehst.', examples:[['Sie spart Geld, um ein Fahrrad zu kaufen.','She saves money in order to buy a bicycle.'],['Ich erkläre es noch einmal, damit alle es verstehen.','I explain it again so that everyone understands.']], mistakes:[['❌ Ich helfe dir, um du die Aufgabe schaffst.','✅ Ich helfe dir, damit du die Aufgabe schaffst.']], exercise:{q:'Ich lerne viel, ___ die Prüfung zu bestehen.',options:['damit','um','weil'],correct:1,why:'The same person learns and passes the exam: um ... zu.'}},
    {title:'Infinitive with zu', explanation:'Many verbs and expressions are followed by zu + infinitive. The infinitive phrase is commonly placed at the end; separable verbs insert zu between prefix and stem.', rule:'Ich habe vor, mehr zu lesen.\nEs ist wichtig, pünktlich zu sein.\nanrufen → anzurufen\naufstehen → aufzustehen', examples:[['Ich versuche, jeden Tag zu üben.','I try to practise every day.'],['Sie hat vergessen, mich anzurufen.','She forgot to call me.']], mistakes:[['❌ Ich versuche, lerne mehr.','✅ Ich versuche, mehr zu lernen.']], exercise:{q:'Ich habe keine Zeit, dich ___. (anrufen)',options:['anzurufen','zu anrufen','anrufen zu'],correct:0,why:'With separable verbs, zu goes between the prefix and stem.'}},
    {title:'Präteritum of sein and haben', explanation:'In stories and descriptions, war and hatte are extremely common past forms. They often sound more natural than Perfekt for states and possession.', rule:'sein: ich war, du warst, er war, wir waren, ihr wart, sie waren\nhaben: ich hatte, du hattest, er hatte, wir hatten, ihr hattet, sie hatten', examples:[['Als Kind war ich sehr schüchtern.','As a child, I was very shy.'],['Wir hatten keine Zeit.','We did not have time.']], mistakes:[['❌ Ich bin gestern krank gewesen (often unnecessarily heavy)','✅ Ich war gestern krank.']], exercise:{q:'Letzte Woche ___ ich krank.',options:['bin','war','wäre'],correct:1,why:'war is the simple past of sein; wäre is Konjunktiv II.'}},
    {title:'Perfekt — inseparable prefixes and -ieren', explanation:'Verbs with be-, emp-, ent-, er-, ge-, miss-, ver- and zer- usually form Partizip II without ge-. Verbs ending in -ieren also omit ge- and normally end in -iert.', rule:'besuchen → besucht\nbezahlen → bezahlt\nverstehen → verstanden\nstudieren → studiert\ntelefonieren → telefoniert', examples:[['Ich habe meine Tante besucht.','I visited my aunt.'],['Er hat Medizin studiert.','He studied medicine.']], mistakes:[['❌ ge-besucht / gestudiert','✅ besucht / studiert']], exercise:{q:'Partizip II of studieren:',options:['gestudiert','studiert','studieren'],correct:1,why:'Verbs ending in -ieren form the participle without ge-.'}},
    {title:'Time conjunctions — bevor and nachdem', explanation:'Bevor means “before” and nachdem means “after”. Both introduce subordinate clauses, so their finite verbs move to the end. The tense relationship matters most when describing past events.', rule:'Bevor ich gehe, rufe ich dich an.\nNachdem ich gegessen hatte, ging ich spazieren.\ncomma + subordinate clause: verb at end', examples:[['Ruf mich an, bevor du losfährst.','Call me before you leave.'],['Nachdem sie gelernt hatte, machte sie eine Pause.','After she had studied, she took a break.']], mistakes:[['❌ Bevor ich gehe ich rufe dich an.','✅ Bevor ich gehe, rufe ich dich an.']], exercise:{q:'Ruf mich an, bevor du ___.',options:['gehst','du gehst','gehen'],correct:0,why:'The finite verb goes to the end of the bevor-clause.'}},
    {title:'Future with werden', explanation:'Use werden + infinitive for explicit future plans, predictions and promises. German often uses present tense with a future time word for practical plans.', rule:'ich werde, du wirst, er wird, wir werden, ihr werdet, sie werden\nwerden + infinitive at the end', examples:[['Ich werde morgen anrufen.','I will call tomorrow.'],['Es wird bald regnen.','It will rain soon.']], mistakes:[['❌ Ich werde morgen anrufe.','✅ Ich werde morgen anrufen.']], exercise:{q:'Morgen ___ ich meine Prüfung schreiben.',options:['werde','wird','wirst'],correct:0,why:'ich → werde; the infinitive schreiben belongs at the end.'}}
  ]
});

/* Add expanded B1 grammar needed for longer texts and exam writing. */
GRAMMAR_DATA.push({
  level: 'B1', title: 'B1 Extended Grammar', items: [
    {title:'Plusquamperfekt — earlier past', explanation:'Use Plusquamperfekt for an event that had already happened before another past event. Form it with hatte/war + Partizip II.', rule:'hatte / war + Partizip II\nNachdem ich gegessen hatte, ging ich spazieren.\nAls wir ankamen, war der Film schon angefangen.', examples:[['Ich hatte die Hausaufgaben schon gemacht, bevor meine Freunde kamen.','I had already done the homework before my friends arrived.'],['Sie war gegangen, als ich anrief.','She had left when I called.']], mistakes:[['❌ Nachdem ich habe gegessen, ...','✅ Nachdem ich gegessen hatte, ...']], exercise:{q:'Bevor der Zug ankam, ___ wir schon eine Stunde ___.',options:['haben / gewartet','hatten / gewartet','waren / warten'],correct:1,why:'The waiting happened before another past event: Plusquamperfekt with hatten + gewartet.'}},
    {title:'Konjunktiv II in the past', explanation:'Use hätte/wäre + Partizip II to imagine a different past or express regret about something that did not happen.', rule:'hätte / wäre + Partizip II\nWenn ich früher losgefahren wäre, hätte ich den Zug erreicht.\nIch hätte dich gern besucht.', examples:[['Wenn sie gelernt hätte, hätte sie die Prüfung bestanden.','If she had studied, she would have passed the exam.'],['Ich wäre gern mitgekommen.','I would have liked to come along.']], mistakes:[['❌ Wenn ich wäre früher gegangen ...','✅ Wenn ich früher gegangen wäre ...']], exercise:{q:'Wenn er früher ___, ___ er den Bus erreicht.',options:['losfuhr / hätte','losgefahren wäre / hätte','losgefahren hätte / wäre'],correct:1,why:'Unreal past: wenn-clause uses wäre + Partizip II; result uses hätte + Partizip II.'}},
    {title:'Passive with modal verbs', explanation:'When a rule, necessity or possibility applies to an action, combine a modal verb with werden + Partizip II. The passive infinitive is werden, placed before the modal verb at the end.', rule:'modal verb + Partizip II + werden\nDie Aufgabe muss heute erledigt werden.\nDas Formular kann online ausgefüllt werden.', examples:[['Der Termin muss verschoben werden.','The appointment has to be postponed.'],['Die Datei kann gespeichert werden.','The file can be saved.']], mistakes:[['❌ Die Aufgabe muss erledigt geworden.','✅ Die Aufgabe muss erledigt werden.']], exercise:{q:'Die Rechnung muss heute ___ ___.',options:['bezahlt / werden','bezahlen / geworden','werden / bezahlt'],correct:0,why:'Passive with a modal ends in Partizip II + werden.'}},
    {title:'Indirect speech — Konjunktiv I', explanation:'Konjunktiv I is used mainly to report what another person says without presenting it as your own claim. In everyday B1 tasks, a dass-clause is also common; learn the formal reported-speech pattern first.', rule:'Er sagt: „Ich bin krank.“\nEr sagt, er sei krank.\nSie sagt: „Wir kommen später.“\nSie sagt, sie kämen später. (replacement form if needed)', examples:[['Die Zeitung schreibt, die Lage sei schwierig.','The newspaper reports that the situation is difficult.'],['Er behauptet, er habe nichts gesehen.','He claims that he saw nothing.']], mistakes:[['❌ Er sagt, er ist krank. (direct quote reported as formal indirect speech)','✅ Er sagt, er sei krank.']], exercise:{q:'Direkt: „Ich habe keine Zeit.“ Indirekt: Sie sagt, sie ___ keine Zeit.',options:['hat','habe','hatte'],correct:1,why:'Konjunktiv I of haben for sie is habe.'}},
    {title:'Two-part connectors', explanation:'Paired connectors help organise arguments and comparisons. Some connect equal alternatives; others show contrast or add a second point. Keep each pair complete and match the grammar in both parts.', rule:'nicht nur ..., sondern auch ...\nsowohl ... als auch ...\nweder ... noch ...\nentweder ... oder ...\nzwar ..., aber ...', examples:[['Sie spricht nicht nur Deutsch, sondern auch Englisch.','She speaks not only German but also English.'],['Entweder fahren wir mit dem Bus oder wir gehen zu Fuß.','Either we take the bus or walk.'],['Zwar ist es teuer, aber die Qualität ist gut.','It is expensive, but the quality is good.']], mistakes:[['❌ nicht nur ..., aber auch ...','✅ nicht nur ..., sondern auch ...']], exercise:{q:'Er spricht ___ Deutsch, ___ Englisch.',options:['sowohl / als auch','weder / sondern','zwar / oder'],correct:0,why:'sowohl ... als auch means both ... and ... .'}},
    {title:'Cause, contrast and condition', explanation:'B1 writing needs you to choose a connector for the relationship between ideas. weil/da explain causes, obwohl shows an unexpected contrast, während can contrast two facts, and falls gives a possible condition.', rule:'weil / da + verb at end\nobwohl / während / falls + verb at end\ndeshalb / trotzdem + verb in position 2', examples:[['Da der Bus nicht kam, nahm ich ein Taxi.','Since the bus did not come, I took a taxi.'],['Obwohl es regnete, spielten die Kinder draußen.','Although it rained, the children played outside.'],['Falls du Hilfe brauchst, ruf mich an.','If you need help, call me.']], mistakes:[['❌ Obwohl es regnet, ich gehe spazieren.','✅ Obwohl es regnet, gehe ich spazieren.']], exercise:{q:'___ ich wenig Zeit habe, helfe ich dir.',options:['Obwohl','Deshalb','Trotzdem'],correct:0,why:'obwohl expresses contrast and sends the verb to the end of its clause.'}},
    {title:'Infinitive clauses — um, ohne, statt ... zu', explanation:'These clauses shorten sentences when the action has the same understood subject. Use um ... zu for a purpose, ohne ... zu for something not done, and statt ... zu for an alternative.', rule:'um ... zu + infinitive = in order to\nohne ... zu + infinitive = without doing\nstatt ... zu + infinitive = instead of doing\nIch ging, ohne mich zu verabschieden.', examples:[['Sie lernt viel, um die Prüfung zu bestehen.','She studies a lot in order to pass the exam.'],['Er ging, ohne sich zu verabschieden.','He left without saying goodbye.'],['Statt zu lernen, spielte er am Computer.','Instead of studying, he played on the computer.']], mistakes:[['❌ Ich spare, um ich ein Auto kaufe.','✅ Ich spare, um ein Auto zu kaufen.']], exercise:{q:'Er ging, ohne sich ___. (verabschieden)',options:['zu verabschieden','verabschieden zu','dass verabschiedet'],correct:0,why:'With a separable verb the form is not needed here; verabschieden takes zu before the infinitive: sich zu verabschieden.'}},
    {title:'Genitive and wegen/trotz', explanation:'The genitive often expresses possession or a relationship between nouns. In formal standard German, wegen and trotz commonly take genitive; colloquial usage may differ.', rule:'das Auto meines Vaters\ndie Farbe des Hauses\nwegen des Wetters\ntrotz der Schwierigkeiten', examples:[['Wegen des starken Regens fiel das Spiel aus.','The match was cancelled because of the heavy rain.'],['Trotz seiner Krankheit ging er zur Arbeit.','Despite his illness, he went to work.']], mistakes:[['❌ wegen dem Wetter (colloquial in many regions)','✅ wegen des Wetters (formal exam style)']], exercise:{q:'Trotz ___ Regens gingen wir spazieren.',options:['dem','des','den'],correct:1,why:'Formal standard German uses genitive after trotz: des Regens.'}},
    {title:'N-declension — masculine nouns', explanation:'A group of masculine nouns adds -(e)n in nearly every case except nominative singular. Many refer to people, professions, animals or nationalities; memorise the noun group.', rule:'der Student → den Studenten\ndem Studenten\ndes Studenten\nder Junge → den Jungen', examples:[['Ich helfe dem Studenten.','I help the student.'],['Das Fahrrad des Nachbarn steht hier.','The neighbour’s bicycle is here.']], mistakes:[['❌ Ich sehe den Student.','✅ Ich sehe den Studenten.']], exercise:{q:'Ich spreche mit dem ___. (Kollege)',options:['Kollege','Kollegen','Kolleges'],correct:1,why:'Kollege is an n-declension masculine noun: mit dem Kollegen.'}},
    {title:'Adjective endings without an article', explanation:'Without an article, adjectives often carry the gender/case ending that would otherwise appear on a der- or ein-word. The ending pattern is sometimes called strong declension.', rule:'Nom. masc.: guter Kaffee\nNom. fem.: frische Milch\nNom. neut.: kaltes Wasser\nDat. masc.: mit gutem Kaffee\nPlural: frische Äpfel', examples:[['Frisches Gemüse ist gesund.','Fresh vegetables are healthy.'],['Mit kaltem Wasser wasche ich das Obst.','I wash the fruit with cold water.']], mistakes:[['❌ mit kalte Wasser','✅ mit kaltem Wasser']], exercise:{q:'Ich trinke ___ Tee. (heiß)',options:['heiße','heißen','heißem'],correct:1,why:'Tee is a masculine accusative object without an article: heißen Tee.'}},
    {title:'Future I — predictions and assumptions', explanation:'Futur I can express a future event, a promise, a plan with emphasis or an assumption about the present. Present tense plus a future time word is often enough for a fixed plan.', rule:'werden + infinitive\nMorgen werde ich anrufen.\nEr wird jetzt zu Hause sein. (assumption)', examples:[['Du wirst die Prüfung schaffen.','You will pass the exam.'],['Sie wird gerade im Zug sein.','She is probably on the train now.']], mistakes:[['❌ Er wird ist zu Hause.','✅ Er wird zu Hause sein.']], exercise:{q:'Er ist nicht im Büro. Er ___ zu Hause sein.',options:['wird','werden','wurde'],correct:0,why:'Futur I uses the conjugated form of werden + infinitive sein.'}},
    {title:'Relative clauses with prepositions', explanation:'When the relative verb or expression requires a preposition, place the preposition before the relative pronoun. The case comes from the preposition; the pronoun agrees in gender and number with the noun it refers to.', rule:'Der Kollege, mit dem ich arbeite, ...\nDie Stadt, in der ich wohne, ...\nDas Thema, über das wir sprechen, ...', examples:[['Das ist die Kollegin, mit der ich arbeite.','That is the colleague with whom I work.'],['Das ist das Thema, über das wir sprechen.','That is the topic we are talking about.']], mistakes:[['❌ die Kollegin, mit die ich arbeite','✅ die Kollegin, mit der ich arbeite']], exercise:{q:'Das ist der Freund, ___ ich oft telefoniere. (mit)',options:['mit dem','mit den','mit der'],correct:0,why:'mit requires dative; Freund is masculine: mit dem.'}},
    {title:'Participle I and II as adjectives', explanation:'A participle can be used before a noun like an adjective and must take an adjective ending. Participle I often describes an active or ongoing action; Participle II often describes a completed action or result.', rule:'Partizip I: lachen → das lachende Kind\nPartizip II: schließen → die geschlossene Tür\nAdd adjective endings for case, gender and article.', examples:[['Die wartenden Gäste stehen draußen.','The waiting guests are standing outside.'],['Die reparierte Maschine funktioniert wieder.','The repaired machine works again.']], mistakes:[['❌ die wartende Gäste','✅ die wartenden Gäste']], exercise:{q:'Die ___ Tür ist abgeschlossen. (schließen)',options:['schließende','geschlossene','geschlossen'],correct:1,why:'Partizip II geschlossene describes the door’s resulting state and takes an adjective ending.'}},
    {title:'Vorgangspassiv and Zustandspassiv', explanation:'Vorgangspassiv with werden focuses on an action or process. Zustandspassiv with sein focuses on a state that results from that action.', rule:'Vorgang: Die Tür wird geöffnet. (someone is opening it)\nZustand: Die Tür ist geöffnet. (it is open)\nPast process: Die Tür wurde geöffnet.', examples:[['Die Straße wird repariert.','The road is being repaired.'],['Die Straße ist gesperrt.','The road is closed (state).']], mistakes:[['❌ Das Fenster ist geöffnet worden (when only state is meant)','✅ Das Fenster ist geöffnet.']], exercise:{q:'The door is currently in the open state: Die Tür ___ geöffnet.',options:['wird','ist','wurde'],correct:1,why:'Use sein for the resulting state, not the process.'}},
    {title:'da-/wo-compounds with verb-preposition pairs', explanation:'These compounds prevent repeating a long noun phrase. da(r)- refers to a thing or idea, while wo(r)- asks about that thing. Use the preposition plus a personal pronoun when talking about a person.', rule:'denken an etwas → daran denken\nsich interessieren für etwas → sich dafür interessieren\nWoran denkst du? / An wen denkst du?', examples:[['Ich denke oft daran.','I often think about it.'],['Worauf wartest du?','What are you waiting for?'],['Auf wen wartest du?','Who are you waiting for?']], mistakes:[['❌ Ich warte auf es.','✅ Ich warte darauf.']], exercise:{q:'Ich freue mich ___, dich zu sehen.',options:['darauf','davon','dazu'],correct:0,why:'sich freuen auf something → sich darauf freuen.'}},
    {title:'Genitive relative pronouns', explanation:'Whose-clauses can use dessen for masculine/neuter antecedents and deren for feminine/plural antecedents. The genitive form does not change with the case required by its role in the relative clause.', rule:'der Mann, dessen Auto hier steht\ndie Frau, deren Tochter hier lernt\ndie Kinder, deren Eltern hier wohnen', examples:[['Das ist der Autor, dessen Buch ich lese.','That is the author whose book I am reading.'],['Wir besuchen die Familie, deren Haus alt ist.','We are visiting the family whose house is old.']], mistakes:[['❌ die Frau, der Tochter hier lernt','✅ die Frau, deren Tochter hier lernt']], exercise:{q:'Das ist die Frau, ___ Sohn hier lernt.',options:['dessen','deren','denen'],correct:1,why:'The antecedent is die Frau, so use deren.'}},
    {title:'lassen — have something done / let', explanation:'Lassen can mean to let/allow someone do something, to leave something in a state, or to have something done by another person. The second verb remains infinitive at the end.', rule:'Ich lasse mein Fahrrad reparieren.\nLass mich bitte ausreden.\nWir lassen die Tür offen.', examples:[['Ich lasse mir die Haare schneiden.','I am having my hair cut.'],['Kannst du mich kurz ausreden lassen?','Can you let me finish speaking?']], mistakes:[['❌ Ich lasse mein Fahrrad repariert.','✅ Ich lasse mein Fahrrad reparieren.']], exercise:{q:'Ich lasse mein Handy ___. (reparieren)',options:['repariert','reparieren','reparierte'],correct:1,why:'lassen + infinitive: reparieren.'}}
  ]
});

  'A1|Negation — nicht or kein': {when:'Choose the negative word based on what you negate, not by translating English word for word.',steps:['Use kein to say “no/not a” with a noun.', 'Use nicht with adjectives, verbs, definite noun phrases and sentence information.'],tip:'kein declines like ein: kein Kaffee, keine Zeit, kein Auto, keine Freunde.'},
  'A1|Indefinite articles — ein/eine': {when:'Use ein/eine for one unspecified person or thing; use the case to choose the ending.',steps:['Nominative describes the subject.', 'Accusative marks the direct object.', 'Masculine accusative is einen; feminine and neuter stay eine/ein.'],tip:'Say the noun and article together each time you revise vocabulary.'},
  'A1|Personal pronouns and verb agreement': {when:'Use the correct finite verb form for the subject in every main clause.',steps:['Identify the subject.', 'Choose the matching verb ending.', 'Remember formal Sie uses the plural verb form.'],tip:'Practise full pairs: du bist, ihr seid, Sie sind.'},
  'A1|Separable verbs in the present': {when:'The prefix separates in a main clause; in an infinitive or subordinate clause the verb may stay together or the whole form moves to the end.',steps:['Conjugate the main verb stem.', 'Put the prefix at the end of the main clause.', 'Keep the verb together in a zu-infinitive but place zu between prefix and stem.'],tip:'Ich stehe auf; ... weil ich früh aufstehe; aufzustehen.'},
  'A1|Imperative — instructions and requests': {when:'Use du for a familiar person, ihr for a group, and Sie for polite or formal instructions.',steps:['Use a short du form, often without pronoun.', 'Use the ihr present form without pronoun.', 'For polite requests use infinitive + Sie.'],tip:'Bitte and danke soften a request: Öffnen Sie bitte das Fenster.'},
  'A1|Possessives — nominative and accusative': {when:'Possessive determiners behave like ein-words and agree with the noun they modify.',steps:['Find the possessor (mein/dein/sein...).', 'Find the noun gender and number.', 'Choose nominative or accusative before adding the correct ending.'],tip:'Masculine accusative adds -en: meinen Bruder, deinen Hund.'},
  'A2|Reflexive verbs': {when:'Learn reflexive verbs with the required pronoun and any fixed preposition.',steps:['Match mich/dich/sich/uns/euch/sich to the subject.', 'Check if the verb needs accusative or dative.', 'Keep a fixed preposition with the verb when present.'],tip:'sich interessieren für; sich freuen auf; sich erinnern an.'},
  'A2|Comparative and superlative': {when:'Compare two things with comparative + als; compare equal qualities with so ... wie; use the superlative for the top degree.',steps:['Add -er for the comparative.', 'Learn common umlaut and irregular forms.', 'Use am + -sten after a verb.'],tip:'gut → besser → am besten; viel → mehr → am meisten.'},
  'A2|Two-way prepositions — location or direction': {when:'Use dative for location and accusative for movement into/towards a destination with two-way prepositions.',steps:['Ask Wo? for a location.', 'Ask Wohin? for a destination.', 'Use the matching article/case in the whole noun phrase.'],tip:'Movement verbs do not always mean accusative; decide from location versus destination.'},
  'A2|Verb-preposition pairs': {when:'A verb often chooses its preposition and case. These pairings should be learned as vocabulary.',steps:['Memorise the verb + preposition + case.', 'Use that case after the preposition.', 'Practise a full sentence rather than the preposition alone.'],tip:'warten auf + Akk.; helfen + Dat.; teilnehmen an + Dat.'},
  'A2|da- and wo-compounds': {when:'Use compounds for things and ideas, but use the preposition plus personal pronoun for people.',steps:['Form wo(r)- + preposition to ask.', 'Form da(r)- + preposition to refer back.', 'Insert r before vowels: woran, daran, darüber.'],tip:'Worauf wartest du? — Ich warte darauf.'},
  'A2|Purpose — um ... zu and damit': {when:'Both structures express purpose; subject identity decides which one fits best.',steps:['Same doer: um ... zu + infinitive.', 'Different subject: damit + subordinate clause.', 'Remember the comma before the subordinate/infinitive clause.'],tip:'Ich lerne, um zu bestehen; Ich helfe dir, damit du bestehst.'},
  'A2|Infinitive with zu': {when:'Common after verbs and expressions such as versuchen, planen, vergessen, Zeit haben, es ist wichtig.',steps:['Place the comma before a longer zu-infinitive phrase.', 'Put zu before a normal infinitive.', 'With separable verbs, insert zu between prefix and stem.'],tip:'anzurufen, aufzustehen, einzukaufen.'},
  'A2|Präteritum of sein and haben': {when:'Use war and hatte for past states, background information and descriptions.',steps:['Learn war/hatte and their person endings.', 'Keep time phrases and word order as in a normal main clause.', 'Use Perfekt for many other spoken past actions.'],tip:'In everyday German, “Ich war müde” is often more natural than “Ich bin müde gewesen”.'},
  'A2|Perfekt — inseparable prefixes and -ieren': {when:'Check the prefix or infinitive ending before adding ge-.',steps:['be-, emp-, ent-, er-, ge-, miss-, ver-, zer- usually have no ge-.', 'Verbs ending in -ieren use -iert without ge-.'],tip:'besucht, erklärt, verstanden, studiert, telefoniert.'},
  'A2|Time conjunctions — bevor and nachdem': {when:'Use these to show which event happens first; both create a subordinate clause.',steps:['Add a comma between clauses.', 'Move the finite verb to the end.', 'Choose tenses that make the event order clear.'],tip:'nachdem often pairs with Plusquamperfekt in past narration.'},
  'A2|Future with werden': {when:'Use Futur I for predictions or emphasis on the future; present tense also works for many scheduled plans.',steps:['Conjugate werden in position 2.', 'Put the infinitive at the end.'],tip:'Morgen fahre ich nach Delhi and Morgen werde ich nach Delhi fahren are both possible.'},
  'B1|Plusquamperfekt — earlier past': {when:'Use it for an event that was already complete before another past reference point.',steps:['Choose hatte or war.', 'Add Partizip II at the end.', 'Use nachdem/bevor/als to make the timeline clear.'],tip:'The earlier event uses Plusquamperfekt; the later past event often uses Präteritum or Perfekt.'},
  'B1|Konjunktiv II in the past': {when:'Use it for unreal past conditions and regret.',steps:['Build hätte/wäre.', 'Add Partizip II.', 'Put the finite Konjunktiv verb at the end of the wenn-clause.'],tip:'Wenn ich früher gekommen wäre, hätte ich dich gesehen.'},
  'B1|Passive with modal verbs': {when:'Use it when the action is necessary, possible or required but the agent is less important.',steps:['Conjugate the modal in position 2.', 'Place Partizip II before werden at the end.'],tip:'muss repariert werden; kann geöffnet werden; soll abgegeben werden.'},
  'B1|Indirect speech — Konjunktiv I': {when:'Common in news reports, summaries and formal writing when reproducing another person’s statement.',steps:['Convert the speaker’s sentence to a report clause.', 'Use the Konjunktiv-I form where distinct from indicative.', 'When forms are ambiguous, German may use a replacement Konjunktiv II form or dass-clause.'],tip:'Er sagt, er habe keine Zeit; Sie sagt, sie sei krank.'},
  'B1|Two-part connectors': {when:'Use paired connectors to make arguments and longer writing easier to follow.',steps:['Plan both halves before writing.', 'Keep parallel sentence elements in both halves.', 'Use commas and verb position according to the connector pattern.'],tip:'nicht nur ..., sondern auch ...; zwar ..., aber ...; weder ..., noch ... .'},
  'B1|Cause, contrast and condition': {when:'Select the connector according to meaning: cause, contrast, simultaneous contrast or condition.',steps:['Subordinating connectors put the finite verb at the end.', 'Adverbs such as deshalb and trotzdem keep main-clause verb-second order.', 'If the subordinate clause comes first, invert the main clause after its comma.'],tip:'Obwohl ich müde bin, lerne ich. / Ich bin müde. Trotzdem lerne ich.'},
  'B1|Infinitive clauses — um, ohne, statt ... zu': {when:'Use these when the subject of the infinitive is understood to be the same as the main-clause subject.',steps:['Choose um for purpose, ohne for an omitted action, statt for an alternative.', 'Use a comma before a longer infinitive group.', 'Keep the infinitive group at the end.'],tip:'For a different subject, use damit + a full clause instead of um ... zu.'},
  'B1|Genitive and wegen/trotz': {when:'Genitive expresses possession/relationship and appears after certain prepositions in formal German.',steps:['Learn the genitive article forms des/der.', 'Masculine and neuter nouns commonly add -s or -es.', 'Keep genitive in formal exam writing after wegen and trotz.'],tip:'wegen des Wetters; trotz der Probleme; das Auto meines Vaters.'},
  'B1|N-declension — masculine nouns': {when:'Recognise these nouns early because their endings change whenever they are not nominative singular.',steps:['Learn each noun with its genitive/dative/accusative pattern.', 'Add -(e)n outside nominative singular.', 'Remember common nouns: Student, Kollege, Junge, Mensch, Herr, Nachbar.'],tip:'den Studenten, dem Kollegen, mit dem Jungen.'},
  'B1|Adjective endings without an article': {when:'An adjective without a preceding article carries a stronger grammatical ending.',steps:['Find case, gender and number.', 'Check whether a noun phrase is subject/object or follows a preposition.', 'Match the adjective ending to the strong-declension pattern.'],tip:'guter Kaffee; kaltes Wasser; mit frischem Brot; frische Äpfel.'},
  'B1|Future I — predictions and assumptions': {when:'Besides the future, Futur I often expresses what the speaker assumes is likely now.',steps:['Conjugate werden in position 2.', 'Place the infinitive at the end.', 'Use contextual words such as wohl, bestimmt or sicher when appropriate.'],tip:'Er wird jetzt zu Hause sein = He is probably at home now.'},
  'B1|Relative clauses with prepositions': {when:'Use a preposition before the relative pronoun when the relative verb or phrase requires it.',steps:['Choose the antecedent’s gender and number.', 'Let the preposition decide the pronoun case.', 'Put the relative-clause finite verb at the end.'],tip:'mit dem, mit der, auf das, für die; comma before and after inserted relative clauses.'},
  'B1|Participle I and II as adjectives': {when:'Participles can condense relative clauses and are useful in formal descriptions.',steps:['Participle I often describes an active/ongoing action.', 'Participle II often describes a completed action or affected/result state.', 'Add ordinary adjective endings.'],tip:'die wartenden Gäste = Gäste, die warten; die reparierte Maschine = die Maschine, die repariert wurde.'},
  'B1|Vorgangspassiv and Zustandspassiv': {when:'Choose werden for a process and sein for the resulting state.',steps:['Ask whether an action is happening or describing the result.', 'Process: werden + Partizip II.', 'State: sein + Partizip II as an adjective.'],tip:'Die Tür wird geöffnet (process); Die Tür ist geöffnet (state).'},
  'B1|da-/wo-compounds with verb-preposition pairs': {when:'Use da(r)- compounds to avoid repeating a thing or idea after a verb-preposition pair.',steps:['Learn each verb with its fixed preposition and case.', 'Use wo(r)- to ask about a thing and da(r)- to refer back.', 'For people, use preposition + wen/wem or personal pronoun.'],tip:'Ich denke daran; Woran denkst du?; An wen denkst du?'},
  'B1|Genitive relative pronouns': {when:'Use dessen/deren to express possession inside a relative clause (“whose”).',steps:['dessen refers to masculine/neuter singular antecedents.', 'deren refers to feminine singular and plural antecedents.', 'Place the relative-clause finite verb at the end.'],tip:'Der Autor, dessen Buch ...; die Frau, deren Sohn ... .'},

let _voice = null;
function getGermanVoice(){
  if(_voice) return _voice;
  if(!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  _voice = voices.find(v => v.lang === 'de-DE') || voices.find(v => v.lang && v.lang.startsWith('de')) || null;
  return _voice;
}
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { _voice = null; getGermanVoice(); };
function speakGerman(text, rate){
  if(!S.settings.audioEnabled) return;
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const clean = String(text).replace(/\s+/g, ' ').trim();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'de-DE'; u.rate = rate || S.settings.speechRate || 0.9; u.pitch = 1;
  const v = getGermanVoice(); if(v) u.voice = v;
  speechSynthesis.speak(u);
  trackAudioPlay();
}
function speakerBtn(text, size){
  const sz = size ? `style="font-size:${size};min-width:28px;min-height:28px;padding:4px"` : '';
  return `<button class="speak-btn" data-speak="${esc(text)}" aria-label="Pronounce" ${sz}>🔊</button>`;
}
function wireSpeakers(root){
  (root || document).querySelectorAll('.speak-btn[data-speak]').forEach(b => {
    if(b.dataset.wired) return; b.dataset.wired = '1';
    b.addEventListener('click', e => {
      e.stopPropagation();
      speakGerman(b.dataset.speak);
      b.style.transform = 'scale(0.85)';
      setTimeout(() => b.style.transform = '', 180);
    });
  });
}

function vocabKey(w){ return 'v' + w.n; }
function getMastery(key){
  return S.mastery[key] || {seen:0, correct:0, wrong:0, streak:0, ease:2.5, interval:0, lastSeen:0, nextReview:0, status:'NEW'};
}
function updateMastery(key, quality){
  let q = quality;
  if(q === true) q = 2;
  if(q === false) q = 0;
  const m = getMastery(key);
  m.seen++; recordPracticeActivity(S.lastView || 'vocabulary', q >= 1);
  if(q >= 1){ m.correct++; m.streak++; } else { m.wrong++; m.streak = 0; }
  if(q === 0){ m.interval = 10/(60*24); m.ease = Math.max(1.3, m.ease - 0.2); }
  else if(q === 1){ m.interval = m.interval ? Math.max(1, m.interval * 1.2) : 1; m.ease = Math.max(1.3, m.ease - 0.15); }
  else if(q === 2){ m.interval = m.interval ? Math.max(1, m.interval * m.ease) : 1; }
  else { m.interval = m.interval ? Math.max(3, m.interval * m.ease * 1.3) : 3; m.ease = Math.min(3.0, m.ease + 0.15); }
  m.interval = Math.min(m.interval, 365);
  m.lastSeen = Date.now();
  m.nextReview = Date.now() + m.interval * 24*60*60*1000;
  if(m.correct >= 8 && m.streak >= 4) m.status = 'MASTERED';
  else if(m.correct >= 4 && m.streak >= 2) m.status = 'STRONG';
  else if(m.correct >= 2) m.status = 'FAMILIAR';
  else if(m.seen > 0) m.status = 'LEARNING';
  S.mastery[key] = m;
  if(m.status === 'MASTERED' || m.status === 'STRONG') S.known[key] = 1;
  STORE.save(); checkAchievements();

}

function distractorCount(difficulty){ return difficulty <= 1 ? 2 : 3; }
function betterDistractors(w, count, mode){
  // Prefer same level, same topic, same article (for nouns), similar length; avoid identical meanings
  const sameLevel = VOCAB.filter(x => x !== w && x.level === w.level);
  const sameTopic = sameLevel.filter(x => x.topic === w.topic);
  const sameArt = VOCAB.filter(x => x !== w && x.art && x.art === w.art && x.art !== '-');
  let pool = [];
  if(mode === 'meaning'){
    const correct = meaningFull(w);
    const prefer = (sameTopic.length >= count ? sameTopic : sameLevel.length >= count ? sameLevel : VOCAB)
      .filter(x => meaningFull(x) !== correct);
    pool = prefer;
  } else if(mode === 'de'){
    const prefer = (sameTopic.length >= count ? sameTopic : sameLevel.length >= count ? sameLevel : VOCAB)
      .filter(x => x.de !== w.de);
    // Prefer similar length words for harder confusion
    prefer.sort((a,b) => Math.abs(a.de.length - w.de.length) - Math.abs(b.de.length - w.de.length));

    const type_ = type || pick(['de-en','en-de','article','listen']);

      const correct = meaningFull(w);

      const options = shuffle([correct, ...wrongPool.map(x => meaningFull(x))]);
      // Deduplicate options just in case
      const unique = [...new Set(options)];
      while(unique.length < distractorCount(difficulty)+1){
        const extra = meaningFull(VOCAB[Math.floor(Math.random()*VOCAB.length)]);
        if(!unique.includes(extra)) unique.push(extra);

      const wrongs = shuffle(OPPOSITES.filter(p => p[0] !== correct && p[2] !== correct && p[0] !== promptWord && p[2] !== promptWord)

      const useHead = Math.random() < 0.7 || entry.syn.length === 0;
      const promptWord = useHead ? entry.word : entry.syn[Math.floor(Math.random()*entry.syn.length)][0];
      const correct = useHead ? entry.syn[0][0] : entry.word;
      const allRelated = new Set([entry.word, ...entry.syn.map(x => x[0])]);
      const wrongs = shuffle(SYNONYMS.filter(s => s.word !== entry.word)
        .flatMap(s => [s.word, ...s.syn.map(x => x[0])]))
        .filter(x => !allRelated.has(x)).slice(0, distractorCount(difficulty));
      const unique = [...new Set([correct, ...wrongs])];
      while(unique.length < distractorCount(difficulty)+1){
        const extra = SYNONYMS[Math.floor(Math.random()*SYNONYMS.length)].word;
        if(!unique.includes(extra) && !allRelated.has(extra)) unique.push(extra);
      }
      ex = {skill:'synonyms', prompt:`Which word is a synonym of "${promptWord}"?`, promptHTML:`Which word is a synonym of <b>${esc(promptWord)}</b>? ${speakerBtn(promptWord)}`,
        options: shuffle(unique.slice(0, distractorCount(difficulty)+1)), correct, explanation:`${promptWord} ≈ ${correct}`, sourceId:'syn-'+promptWord, difficulty};
    }
    if(!ex){ attempts++; continue; }
    const fp = exerciseFingerprint(ex.prompt + '|' + ex.correct);
    if(!isDuplicate(fp)){ rememberFingerprint(fp); return ex; }
    attempts++;
  }
  // Safe fallback without dummy options
  const w = usePool[Math.floor(Math.random()*usePool.length)] || VOCAB[0];
  const speakText = (w.art && w.art !== '-' ? w.art + ' ' : '') + w.de;
  const wrongs = shuffle(VOCAB.filter(x => x.de !== w.de)).slice(0,2).map(x => meaningFull(x));
  return {skill:'vocabulary', prompt:`What does "${speakText}" mean?`, promptHTML:`What does <b>${esc(speakText)}</b> mean?`,
    options: shuffle([meaningFull(w), ...wrongs]), correct: meaningFull(w), explanation:`${speakText} = ${meaningFull(w)}`, sourceId:'v'+w.n, vocab:w};
}

function generateScenario(level, topic){
  const isF = rnd() < 0.5;
  const name = rPick(isF ? POOL.namesF : POOL.namesM);
  const pronoun = isF ? 'sie' : 'er';
  const city = rPick(POOL.cities);
  let dest = rPick(POOL.cities); let g = 0;
  while(dest === city && g++ < 5) dest = rPick(POOL.cities);
  return {name, pronoun, isF, city, dest, time: rPick(POOL.times), transport: rPick(POOL.transport),
    activity: rPick(POOL.activities), problem: rPick(POOL.problems), feeling: rPick(POOL.feelings),
    level: level || 'A2', topic: topic || 'daily-life'};
}

function generateVerbUsageExercise(){
  const keys = Object.keys(VERB_USAGE || {});
  if(!keys.length) return generateVocabExercise('de-en');
  const k = rPick(keys);
  const u = VERB_USAGE[k];
  const pattern = rPick(u.patterns);
  const words = pattern.split(/\s+/);
  const candidates = words.map((w,i) => ({w, i})).filter(x => x.w.length > 2 && /^[a-zäöüß]/i.test(x.w));
  if(!candidates.length) return generateVocabExercise('de-en');
  const blank = rPick(candidates);
  const prompt = words.map((w,i) => i === blank.i ? '___' : w).join(' ');
  const correct = blank.w;
  const wrongPool = [];
  keys.forEach(kk => VERB_USAGE[kk].patterns.forEach(p => p.split(/\s+/).forEach(w => {
    if(w !== correct && w.length > 3 && !wrongPool.includes(w)) wrongPool.push(w);
  })));
  while(wrongPool.length < 3) wrongPool.push('gehen');
  return {
    skill:'verb-usage', topic:'verb usage', level:'A2',
    promptHTML:`Which word completes: <b>${esc(prompt)}</b>?<br><em class="mini-muted">Verb: ${esc(k)} (${esc(u.meaning)})</em>`,
    prompt:`Complete: ${prompt} (verb: ${k})`,
    options: shuffle([correct, ...shuffle(wrongPool).slice(0,3)]),
    correct, explanation:`${pattern} — from verb ${k}`, sourceId:'verb-'+k
  };
}

function generateGrammarExerciseLadder(level, difficulty){
  const sections = level && level !== 'all' ? GRAMMAR_DATA.filter(s => s.level === level) : GRAMMAR_DATA;
  const section = rPick(sections);
  const item = rPick(section.items);
  const diff = difficulty || 'normal';

  if(diff === 'expert' && item.mistakes && item.mistakes.length){
    const pair = rPick(item.mistakes);
    const bad = pair[0].replace(/^❌\s*/, '');
    const correct = pair[1].replace(/^✅\s*/, '');
    const distractors = item.mistakes.filter(p => p !== pair).map(p => p[0].replace(/^❌\s*/, ''));
    while(distractors.length < 3) distractors.push(correct.replace(/[a-zäöü]/g, m => m.toUpperCase()));
    return {
      skill:'grammar', topic:item.title, level:section.level,
      promptHTML:`Correct this sentence:<br><b>${esc(bad)}</b>`,
      prompt:`Correct: ${bad}`,
      options: shuffle([correct, ...shuffle(distractors).slice(0,3)]),
      correct, explanation: item.explanation, sourceId:'gx-'+section.level+'-'+item.title
    };
  }

  if(item.examples && item.examples.length){
    const ex = rPick(item.examples);
    const de = ex[0], en = ex[1];
    const words = de.split(/\s+/);
    const candidates = [];
    words.forEach((w, i) => {
      const c = w.replace(/[.,!?;:]/g, '');
      if(i > 0 && c.length > 3 && !/^\d+$/.test(c)) candidates.push(i);
    });
    if(candidates.length){
      const blankIdx = rPick(candidates);
      const correct = words[blankIdx].replace(/[.,!?;:]/g, '');
      const prompt = words.map((w, i) => i === blankIdx ? '___' : w).join(' ');
      const wrongs = [];
      item.examples.forEach(e => e[0].split(/\s+/).forEach(w => {
        const c = w.replace(/[.,!?;:]/g, '');
        if(c !== correct && c.length > 2 && !wrongs.includes(c)) wrongs.push(c);
      }));
      if(wrongs.length < 3){
        section.items.forEach(it => (it.examples || []).forEach(e => e[0].split(/\s+/).forEach(w => {
          const c = w.replace(/[.,!?;:]/g, '');
          if(c !== correct && c.length > 2 && !wrongs.includes(c)) wrongs.push(c);
        })));
      }
      while(wrongs.length < 3) wrongs.push('gehen');
      return {
        skill:'grammar', topic:item.title, level:section.level,
        promptHTML:`${esc(prompt)}<br><em class="mini-muted">${esc(en)}</em>`,
        prompt,
        options: shuffle([correct, ...shuffle(wrongs).slice(0,3)]),
        correct, explanation:`${correct} → "${de}"`, sourceId:'g-'+section.level+'-'+item.title
      };
    }
  }
  const ex = item.exercise;
  const correct = ex.options[ex.correct];
  return {
    skill:'grammar', topic:item.title, level:section.level,
    promptHTML:esc(ex.q), prompt:ex.q,
    options: shuffle([...ex.options]), correct,
    explanation: ex.why, sourceId:'g-'+section.level+'-'+item.title
  };
}

function generateConnectorExercise(c){
  const options = ['main clause — verb position 2', 'subordinate clause — verb at end', 'adverb — verb next'];
  const correct = c.clause === 'main' ? (c.order === 'position-2-verb-next' || c.order === 'verb-position-2' ? 2 : 0) : 1;
  return {
    prompt: `"${c.word}" (${c.meaning}) — how is it used?`,
    promptHTML: `<b>${esc(c.word)}</b> (${esc(c.meaning)}) — clause type?`,
    options, correct: options[correct],
    explanation: `${c.word} — ${c.clause}, ${c.order}`,
    connector: c
  };
}
function generateCollocationExercise(c){
  const allVerbs = shuffle(COLLOCATIONS.map(x => x.verb).filter(v => v !== c.verb)).slice(0, 3);
  const options = shuffle([c.verb, ...allVerbs]);
  const prompt = c.phrase.replace(new RegExp('\\b' + c.verb + '\\b'), '___');
  return {
    prompt: `Which verb completes: "${prompt}"?`,
    promptHTML: `Which verb completes <b>${esc(prompt)}</b>?`,
    options, correct: c.verb,
    explanation: `${c.phrase} — ${c.en}`,
    collocation: c
  };
}
function generateComparisonExercise(c){
  const idx = rnd() < 0.5 ? 0 : 1;
  const ex = c.examples[idx];
  const correct = idx === 0 ? c.a : c.b;
  const other = idx === 0 ? c.b : c.a;
  return {
    prompt: ex, promptHTML: ex.replace('___', '<b>___</b>'),
    options: shuffle([correct, other]), correct,
    explanation: idx === 0 ? c.aEx : c.bEx,
    note: c.note, comparison: c
  };
}
function generateSentenceBuilderExercise(level){
  const lvl = level && level !== 'all' ? level : rPick(['A1','A2','B1']);
  const subj = rPick([['Ich','I'], ['Du','You'], ['Er','He'], ['Sie','She'], ['Wir','We'], ['Ihr','You (pl)']]);
  const nouns = VOCAB.filter(w => ['der','die','das'].includes(w.art) && w.level === lvl);
  const poolN = nouns.length ? nouns : VOCAB.filter(w => ['der','die','das'].includes(w.art));
  const obj = rPick(poolN);
  // Accusative article adjustment for common verbs that take Akk
  const artMap = {der:'den', die:'die', das:'das'};
  const akkArt = artMap[obj.art] || obj.art;
  const verbTable = {
    A1: [
      ['gehe','go', false], ['komme','come', false], ['lerne','learn', true], ['spiele','play', true],
      ['esse','eat', true], ['trinke','drink', true], ['sehe','see', true], ['höre','hear', true]
    ],
    A2: [
      ['habe','have', true], ['kaufe','buy', true], ['brauche','need', true], ['suche','look for', true],
      ['finde','find', true], ['nehme','take', true], ['lese','read', true], ['schreibe','write', true]
    ],
    B1: [
      ['besuche','visit', true], ['verstehe','understand', true], ['kenne','know', true],
      ['erkläre','explain', true], ['vergleiche','compare', true], ['beschreibe','describe', true]
    ]
  };
  const verbs = verbTable[lvl] || verbTable.A1;
  const pair = rPick(verbs);
  const conjForm = pair[0], infEn = pair[1], takesAkk = pair[2];
  // Simple person agreement for a few irregulars is already in the forms (ich-forms mostly; adjust for du/er)
  let conj = conjForm;
  if(subj[0] === 'Du'){
    if(conjForm.endsWith('e') && !conjForm.endsWith('ie')) conj = conjForm.slice(0,-1) + 'st';
    else if(conjForm === 'habe') conj = 'hast';
    else if(conjForm === 'gehe') conj = 'gehst';
    else if(conjForm === 'komme') conj = 'kommst';
    else if(conjForm === 'sehe') conj = 'siehst';
    else if(conjForm === 'nehme') conj = 'nimmst';
    else if(conjForm === 'lese') conj = 'liest';
  } else if(subj[0] === 'Er' || subj[0] === 'Sie'){
    if(conjForm.endsWith('e') && !conjForm.endsWith('ie')) conj = conjForm.slice(0,-1) + 't';
    else if(conjForm === 'habe') conj = 'hat';
    else if(conjForm === 'gehe') conj = 'geht';
    else if(conjForm === 'komme') conj = 'kommt';
    else if(conjForm === 'sehe') conj = 'sieht';
    else if(conjForm === 'nehme') conj = 'nimmt';
    else if(conjForm === 'lese') conj = 'liest';
  } else if(subj[0] === 'Wir'){
    conj = conjForm.endsWith('e') ? conjForm.slice(0,-1) + 'en' : conjForm + 'en';
    if(conjForm === 'habe') conj = 'haben';
    if(conjForm === 'sehe') conj = 'sehen';
    if(conjForm === 'nehme') conj = 'nehmen';
    if(conjForm === 'lese') conj = 'lesen';
  } else if(subj[0] === 'Ihr'){
    if(conjForm.endsWith('e')) conj = conjForm.slice(0,-1) + 't';
    if(conjForm === 'habe') conj = 'habt';
    if(conjForm === 'sehe') conj = 'seht';
    if(conjForm === 'nehme') conj = 'nehmt';
    if(conjForm === 'lese') conj = 'lest';
  }
  const art = takesAkk ? akkArt : obj.art;
  const answer = `${subj[0]} ${conj} ${art} ${obj.de}.`;
  const en = `${subj[1]} ${infEn} the ${obj.en}.`;
  const tokens = shuffle([subj[0], conj, art, obj.de + '.']);
  return {level: lvl, answer, en, tokens};
}

function generateDictationExercise(level){
  const pool = [];
  PATTERNS.forEach(p => pool.push({de: p[3], en: p[4], level: 'A1'}));
  GRAMMAR_DATA.forEach(s => s.items.forEach(it => it.examples.forEach(e => pool.push({de: e[0], en: e[1], level: s.level}))));
  const filtered = level && level !== 'all' ? pool.filter(p => p.level === level) : pool;
  const item = rPick(filtered.length ? filtered : pool);
  return {level: item.level, de: item.de, en: item.en || ''};
}

/* ---------- Universal registry + dispatcher ---------- */
function diffN(d){ return d === 'easy' ? 1 : d === 'hard' ? 3 : d === 'expert' ? 4 : 2; }

const EXERCISE_REGISTRY = {
  vocab:       (c) => generateVocabExercise(c.type || 'de-en', null, diffN(c.difficulty), c.level),
  article:     (c) => generateVocabExercise('article', null, diffN(c.difficulty), c.level),
  de_en:       (c) => generateVocabExercise('de-en', null, diffN(c.difficulty), c.level),
  en_de:       (c) => generateVocabExercise('en-de', null, diffN(c.difficulty), c.level),
  listenVocab: (c) => generateVocabExercise('listen', null, diffN(c.difficulty), c.level),
  opposite:    (c) => generateVocabExercise('opposite', null, diffN(c.difficulty), c.level),
  synonym:     (c) => generateVocabExercise('synonym', null, diffN(c.difficulty), c.level),
  grammar:     (c) => generateGrammarExerciseLadder(c.level, c.difficulty),
  listening:   (c) => {
    const d = generateDialogueTask(c.level || 'A2');
    const q = rPick(d.questions);
    return {
      skill:'listening', topic:'dialogue', level:d.level,
      promptHTML:`🔊 <button class="btn small" onclick="playDialogue('${esc(d.lines.map(l=>l.de).join('|||')).replace(/'/g,"\'")}')">Play dialogue</button><br><br>${esc(q.q)}`,
      prompt: q.q, options: q.options, correct: q.correct,
      explanation: `Answer: ${q.correct}`, sourceId: 'd-' + d.title, dialogue: d
    };
  },
  connector:   (c) => generateConnectorExercise(rPick(CONNECTORS)),
  collocation: (c) => generateCollocationExercise(rPick(COLLOCATIONS)),
  compare:     (c) => generateComparisonExercise(rPick(VERB_COMPARISONS)),
  verbusage:   (c) => generateVerbUsageExercise(),
  sentence:    (c) => {
    const ex = generateSentenceBuilderExercise(c.level || 'A2');
    const wrongs = [];
    for(let i = 0; i < 3; i++){
      const sh = shuffle([...ex.tokens]).join(' ');
      if(sh !== ex.answer && !wrongs.includes(sh)) wrongs.push(sh);
    }
    while(wrongs.length < 2){
      const alt = generateSentenceBuilderExercise(c.level || 'A2');
      if(alt.answer !== ex.answer && !wrongs.includes(alt.answer)) wrongs.push(alt.answer);
    }
    return {skill:'word-order', topic:'Sentence order', level:ex.level,
      promptHTML:`Which is correct?<br><em class="mini-muted">${esc(ex.en)}</em>`,
      prompt:`Which is correct? "${ex.en}"`,
      options: shuffle([ex.answer, ...wrongs.slice(0,3)]),
      correct: ex.answer, explanation: ex.answer + ' — ' + ex.en};
  },
  mixed:       (c) => {
    const keys = ['vocab','article','de_en','en_de','opposite','synonym','grammar','listening','connector','collocation','compare','verbusage','sentence'];
    return EXERCISE_REGISTRY[rPick(keys)](c);
  }
};

function generateExercise(config){
  config = config || {skill:'vocab', level:'A2', difficulty:'mixed'};
  const gen = EXERCISE_REGISTRY[config.skill] || EXERCISE_REGISTRY.vocab;
  let ex, attempts = 0;
  do {
    try { ex = gen(config); } catch(e){ ex = generateVocabExercise('de-en'); }
    attempts++;
    if(ex && ex.prompt && ex.correct){
      const fp = exerciseFingerprint(ex.prompt + '|' + ex.correct);
      if(!isDuplicate(fp)){ rememberFingerprint(fp); break; }
    }
  } while(attempts < 5);
  return ex || generateVocabExercise('de-en');
}

function generateExerciseBatch({count, skill, level, difficulty, mode}){
  const out = [];
  for(let i = 0; i < count; i++){
    const s = mode === 'mixed' ? 'mixed' : (skill || 'vocab');
    out.push(generateExercise({skill:s, level:level || 'A2', difficulty: difficulty || 'mixed'}));
  }
  return out;
}

function selectAdaptiveSkill(){
  const weak = {};
  Object.values(S.mistakes).forEach(m => {
    const k = (m.type || m.topic || 'misc').split('_')[0];
    weak[k] = (weak[k] || 0) + m.count;
  });
  const entries = Object.entries(weak).sort((a,b) => b[1] - a[1]);
  const roll = rnd();
  if(roll < 0.45 && entries.length) return entries[0][0];
  if(roll < 0.75) return rPick(['vocab','grammar','listening','connector','collocation','compare','verbusage']);
  return 'vocab';
}
function generateAdaptiveExercise(level){
  return generateExercise({skill: selectAdaptiveSkill(), level: level || 'A2', difficulty: 'mixed'});
}

function playDialogue(joined){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const v = getGermanVoice();
  joined.split('|||').forEach(line => {
    const u = new SpeechSynthesisUtterance(line);
    u.lang = 'de-DE'; u.rate = S.settings.speechRate || 0.9;
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  });
  trackAudioPlay();
}
