name: Deploy Sprachtreppe Web App

on:
  push:
    branches: [web-first]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Test course engine
        run: npm test
      - name: Build web app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://biqkgnkiuibckbhfsbrs.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_bpD4TfJpORZR0CFdKbvRmA_hbzCNYq9' }}
        run: python3 scripts/build-course.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload web app
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: sprachtreppe-web
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
