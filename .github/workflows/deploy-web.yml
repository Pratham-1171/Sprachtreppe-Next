name: Deploy Sprachtreppe Web App

on:
  push:
    branches: [main, flutter-shell]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build web app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 scripts/build-course-lms.py
      - name: Setup Flutter for the desktop web client
        if: ${{ hashFiles('flutter_shell/pubspec.yaml') != '' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test and build Flutter web client
        if: ${{ hashFiles('flutter_shell/pubspec.yaml') != '' }}
        run: |
          cd flutter_shell
          flutter create --platforms=web --no-pub .
          rm -f test/widget_test.dart
          mkdir -p assets
          cp ../course/vocabulary-data.js assets/vocabulary-data.js
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --base-href /Sprachtreppe-Next/flutter/
          mkdir -p ../www/flutter
          cp -R build/web/. ../www/flutter/
          python3 - <<'PY'
          from pathlib import Path
          page = Path("../www/flutter/index.html")
          html = page.read_text()
          html = html.replace("<title>sprachtreppe_flutter</title>", "<title>Sprachtreppe | German A1–B1</title>")
          page.write_text(html)
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
