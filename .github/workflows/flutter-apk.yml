name: Build Flutter APK

on:
  push:
    branches: [main, master, chore/flutter-baseline]
    paths:
      - 'flutter_shell/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:

jobs:
  flutter-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Record Flutter and Dart versions
        run: flutter --version

      - name: Create Android project shell
        working-directory: flutter_shell
        run: flutter create --platforms=android --org com.sprachtreppe .

      - name: Restore tracked Dart app files
        run: |
          test -f flutter_shell/lib/main.dart
          test -f flutter_shell/pubspec.yaml

      - name: Get dependencies
        working-directory: flutter_shell
        run: flutter pub get

      - name: Analyze
        id: flutter_analyze
        continue-on-error: true
        working-directory: flutter_shell
        run: flutter analyze

      - name: Test
        id: flutter_test
        continue-on-error: true
        working-directory: flutter_shell
        run: flutter test

      - name: Build debug APK
        id: flutter_build
        continue-on-error: true
        working-directory: flutter_shell
        run: flutter build apk --debug

      - name: Upload Flutter APK
        uses: actions/upload-artifact@v4
        with:
          name: Sprachtreppe-Flutter-APK
          path: flutter_shell/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Report baseline check results
        if: always()
        env:
          ANALYZE_OUTCOME: ${{ steps.flutter_analyze.outcome }}
          TEST_OUTCOME: ${{ steps.flutter_test.outcome }}
          BUILD_OUTCOME: ${{ steps.flutter_build.outcome }}
        run: |
          printf 'flutter analyze: %s\n' "$ANALYZE_OUTCOME"
          printf 'flutter test: %s\n' "$TEST_OUTCOME"
          printf 'flutter build apk --debug: %s\n' "$BUILD_OUTCOME"
          test "$ANALYZE_OUTCOME" = "success" &&
          test "$TEST_OUTCOME" = "success" &&
          test "$BUILD_OUTCOME" = "success"
