name: Provision Sprachtreppe Next Supabase

# Deliberately manual: the production LMS is already migrated. Never replay
# the historical UUID-based 001-012 SQL over the canonical bigint schema.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate migration credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret."; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Add the SUPABASE_DB_PASSWORD repository secret."; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare only the canonical Next migration history
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          mkdir -p supabase/migrations
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -delete

          # These timestamps match the applied migration ledger in
          # sprachtreppe-next. 001-012 are historical intermediate migrations
          # and are intentionally excluded.
          cp backend/schema.sql supabase/migrations/20261015041323_sprachtreppe_base_schema.sql
          cp backend/migrations/013_student_otp_signup.sql supabase/migrations/20261015041332_student_otp_signup.sql

          # The production ledger contains this legacy version, but its old SQL
          # source used incompatible UUID class IDs. The canonical migration 016
          # below owns the actual Next LMS schema, so this compatibility marker
          # intentionally performs no DDL.
          cat > supabase/migrations/20261015041341_lms_phase1_teacher_roles.sql <<'SQL'
          -- Compatibility marker for a historical production ledger entry.
          -- Do not replay backend/migrations/001_lms_phase1.sql on Sprachtreppe Next.
          -- The canonical bigint LMS schema is applied in 016_flutter_lms_canonical.sql.
          select 1;
          SQL

          cp backend/migrations/014_flutter_notification_center.sql supabase/migrations/20261015050755_flutter_notification_center.sql
          cp backend/migrations/015_harden_flutter_notification_read.sql supabase/migrations/20261015050829_harden_flutter_notification_read.sql
          cp backend/migrations/016_flutter_lms_canonical.sql supabase/migrations/20261015073053_flutter_lms_canonical.sql
          cp backend/migrations/017_lms_submission_guardrails.sql supabase/migrations/20261015073258_lms_submission_guardrails.sql
          cp backend/migrations/018_cross_device_learning_state.sql supabase/migrations/20261015095001_cross_device_learning_state.sql
          cp backend/migrations/019_recompute_cross_device_learning_aggregates.sql supabase/migrations/20261015095743_recompute_cross_device_learning_aggregates.sql
          cp backend/migrations/020_sync_cross_device_answer_batches.sql supabase/migrations/20261015100234_sync_cross_device_answer_batches.sql
          cp backend/migrations/021_durable_learning_answer_event_ledger.sql supabase/migrations/20261015101528_durable_learning_answer_event_ledger.sql
          cp backend/migrations/022_merge_streak_by_latest_study_date.sql supabase/migrations/20261015104251_merge_current_streak_by_latest_study_date.sql
          cp backend/migrations/023_preserve_latest_streak_study_date.sql supabase/migrations/20261015104430_preserve_latest_streak_study_date.sql
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 13

      - name: Link to sprachtreppe-next
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref nkmiziinazafpbsavyxg --password "$SUPABASE_DB_PASSWORD"

      - name: Inspect migration ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: Push canonical migrations only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
