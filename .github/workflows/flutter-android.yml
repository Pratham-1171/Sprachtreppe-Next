name: Flutter Android

on:
  push:
    branches: [flutter-shell]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_shell
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --no-pub .
      - name: Ensure Android Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if "android.permission.INTERNET" not in content:
              end = content.find(">")
              if end < 0 or "<manifest" not in content[:end + 1]:
                  raise SystemExit("Could not find the opening manifest tag.")
              content = content[:end + 1] + "\n" + permission + content[end + 1:]
              manifest.write_text(content)
          if "android.permission.INTERNET" not in manifest.read_text():
              raise SystemExit("Android Internet permission is missing.")
          PY
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart
      - name: Prepare legacy vocabulary asset
        run: |
          mkdir -p assets
          cp ../course/vocabulary-data.js assets/vocabulary-data.js
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sprachtreppe-flutter-apk
          path: flutter_shell/build/app/outputs/flutter-apk/app-release.apk
