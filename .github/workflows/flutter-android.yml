name: Flutter Android

on:
  push:
    branches: [flutter-shell]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_shell
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --no-pub .
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart
      - name: Prepare legacy vocabulary asset
        run: |
          mkdir -p assets
          cp ../course/vocabulary-data.js assets/vocabulary-data.js
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sprachtreppe-flutter-apk
          path: flutter_shell/build/app/outputs/flutter-apk/app-release.apk
