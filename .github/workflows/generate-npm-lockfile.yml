name: Generate and verify npm lockfile

on:
  push:
    branches:
      - fix/npm-lockfile-ci
    paths:
      - .github/workflows/generate-npm-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package-lock.json from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Check lockfile metadata
        run: |
          test -s package-lock.json
          node -e "const p=require('./package-lock.json'); if (p.name !== 'sprachtreppe' || p.packages?.['']?.name !== 'sprachtreppe') process.exit(1); console.log('Lockfile version:', p.lockfileVersion, '| root package:', p.name);"

      - name: Commit the generated lockfile to this fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes were generated."
            exit 1
          fi
          git commit -m "chore: add npm lockfile for reproducible CI"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify clean install
        run: npm ci --no-audit --no-fund

      - name: Run project tests
        run: npm test
